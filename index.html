<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f5946"><link rel="manifest" href="manifest.json"><title>日日斯多噶 3.0</title>
<style>
:root{--bg:#eef0e8;--paper:#fffdf7;--ink:#252a24;--muted:#74786e;--green:#3f5946;--gold:#b38b4e;--line:#deded2;--soft:#f1f2eb}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f7f5ec,#e9eee6);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
.app{max-width:780px;margin:auto;padding:18px 16px 60px}.top,.dateLine,.calendarTitle{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.1em}.tag,.small,.muted{font-size:12px;color:var(--muted)}
button{font:inherit;cursor:pointer}.iconBtn{border:1px solid var(--line);background:var(--paper);width:44px;height:44px;border-radius:15px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:20px;margin-top:13px;box-shadow:0 14px 38px #2633260d}.hero{background:linear-gradient(145deg,#314737,#58705b);color:#fff;border:0}.hero .muted{color:#dbe6da}
.date{font-size:27px;font-weight:900}.badge{background:#ffffff1c;border:1px solid #ffffff2d;padding:7px 10px;border-radius:99px;font-size:12px}.theme{display:inline-block;margin-top:18px;padding:6px 9px;border-radius:99px;background:#efe2c9;color:#654e2c;font-size:11px}
.quote{font:23px/1.6 Georgia,"Noto Serif TC",serif;margin:17px 0 10px}.explainTitle{font-weight:900;font-size:14px;margin-bottom:5px;color:#f4f7f0}.explain{line-height:1.95;color:#e9eee8;white-space:pre-line}.question{margin-top:13px;padding:13px 14px;border-left:3px solid #d7bf91;background:#ffffff0e;line-height:1.8}.practice{margin-top:15px;padding:14px;border-radius:17px;background:#ffffff12;line-height:1.75}
h3{margin:0 0 13px;font-size:17px}label{font-weight:800;font-size:14px}.moods{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 17px}.mood{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:14px}.mood.active{background:var(--green);color:#fff;border-color:var(--green)}
textarea{width:100%;min-height:105px;border:1px solid var(--line);border-radius:16px;padding:13px;background:#faf9f2;font:inherit;resize:vertical}.row{display:flex;gap:8px;margin-top:10px}.primary,.secondary{border-radius:15px;padding:12px 14px;font-weight:800;border:1px solid var(--line)}.primary{background:var(--green);color:#fff;border-color:var(--green);flex:1}.secondary{background:var(--soft);color:var(--green)}
.ai{background:#f0f3ec;border-left:4px solid var(--green);padding:14px;border-radius:0 16px 16px 0;line-height:1.8}.aiTitle{font-weight:900;color:var(--green);margin-bottom:4px}
.pet{display:flex;gap:15px;align-items:center}.avatar{width:90px;height:90px;border-radius:30px;background:#e9efe7;display:grid;place-items:center;font-size:58px}.petName{font-size:18px;font-weight:900}.bar{height:8px;background:#dfe3da;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;background:var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{text-align:center;background:var(--soft);padding:11px;border-radius:15px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.monthNav{display:flex;align-items:center;gap:7px}.monthNav button{border:0;background:var(--soft);width:32px;height:32px;border-radius:10px}.monthName{font-weight:900;min-width:104px;text-align:center}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.dow,.day{display:grid;place-items:center;min-height:38px;font-size:12px}.dow{color:#8b8d84}.day{border-radius:10px;background:#f5f4ed;cursor:pointer}.day.has{background:#dfeadf}.day.today{outline:2px solid var(--gold)}.day.sel{background:var(--green);color:#fff}.blank{visibility:hidden}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fileLabel{display:block;text-align:center;border:1px solid var(--line);background:var(--soft);color:var(--green);padding:12px;border-radius:15px;font-weight:800}.install{display:none;width:100%;margin-top:10px;border:1px solid #cad5c6;background:#edf3eb;color:var(--green);padding:12px;border-radius:15px;font-weight:800}.install.show{display:block}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#253228;color:#fff;padding:11px 16px;border-radius:99px;display:none}
@media(max-width:520px){.quote{font-size:20px}.card{padding:17px}.date{font-size:24px}.tools{grid-template-columns:1fr}}
#petSection .avatar{font-size:54px;flex-shrink:0}#petSection .petMessage{margin:14px 0;padding:12px 14px;border-radius:14px;background:#eef2e9;line-height:1.7;font-size:14px}#petSection .petGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}#petSection .petGrid label{font-size:12px;margin:0;color:var(--muted)}#petSection input,#petSection select{display:block;width:100%;min-width:0;padding:10px;margin-top:5px;border:1px solid #d8ddcf;border-radius:10px;background:#fff;font:inherit;color:var(--ink)}#petSection .petActions{display:flex;gap:8px;flex-wrap:wrap}#petSection .petBook{margin-top:12px;padding:12px;border:1px solid #d8ddcf;border-radius:12px;font-size:13px;line-height:1.9}#petSection .petBook[hidden],#petSection #petSettings[hidden]{display:none}#petSection #petSettings{margin-top:12px;padding:12px;border:1px solid #d8ddcf;border-radius:12px;background:#fafbf7}#petSection .petActions button{font-size:13px}#petSection .petBook .unlocked{color:var(--green);font-weight:700}@media(max-width:390px){#petSection .petGrid{grid-template-columns:1fr}}
#petSection .petDialogueEnter{animation:petDialogueEnter .28s ease-out}@keyframes petDialogueEnter{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){#petSection .petDialogueEnter{animation:none}}#petSection .avatar{width:126px;height:150px;border-radius:14px;overflow:hidden;background:#e9efe7}#petSection .avatar img{width:100%;height:100%;object-fit:cover;image-rendering:auto}#petSection .pet{align-items:center}@media(max-width:420px){#petSection .avatar{width:104px;height:130px}}

<button id="install" class="install">📱 加到手機桌面</button>

<script>
const E=[{"theme": "控制二分法", "thought": "把注意力放在能由你決定的部分。", "explain": "斯多噶思想最實用的一個起點，是分清楚「我能控制什麼」與「我不能控制什麼」。別人的看法、已經發生的事情、結果是否符合期待，往往不完全由你決定；但你的判斷、選擇與下一個行動，仍然在你手中。當你把力氣從不可控的地方收回來，心就會多一點空間。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天遇到一件讓你不舒服的事，寫下：我無法控制的是什麼？我現在仍能做的是什麼？", "question": "今天，我可以在哪一個小選擇上實踐「控制二分法」？"}, {"theme": "當下", "thought": "人生只能在此刻被活出來。", "explain": "我們很容易把今天交給昨天的後悔，或交給明天的擔心。可是過去不能重新操作，未來也還沒有真正發生。斯多噶不是叫人停止規劃，而是提醒我們：規劃未來之後，仍要把注意力帶回正在發生的這一刻。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天挑一件日常小事，刻意不滑手機、不分心，只做眼前這件事。", "question": "今天，我可以在哪一個小選擇上實踐「當下」？"}, {"theme": "判斷", "thought": "事情本身與我們對事情的解讀，不是同一件事。", "explain": "有人沒有回訊息是一個事實；「他一定討厭我」卻是一個推論。情緒常常不是直接由事件產生，而是被我們附加在事件上的意義放大。先把事實與故事拆開，你才有機會選擇比較穩定的回應。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "遇到情緒時，寫兩行：事實是什麼？我的解讀又是什麼？", "question": "今天，我可以在哪一個小選擇上實踐「判斷」？"}, {"theme": "逆境", "thought": "困難不一定是人生的偏離，也可以成為鍛鍊的材料。", "explain": "我們通常希望道路平坦，但真正能訓練耐心、勇氣、判斷力與韌性的，往往正是那些不順利的時刻。這不是要你喜歡痛苦，而是把已經發生的阻礙轉換成可以使用的訓練場。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天遇到阻礙時，問自己：這件事正在訓練我的哪一種能力？", "question": "今天，我可以在哪一個小選擇上實踐「逆境」？"}, {"theme": "情緒", "thought": "情緒可以被看見，但不必立刻被服從。", "explain": "憤怒、焦慮與失望都是真實的感受，但感受本身不等於命令。你可以承認「我現在很生氣」，同時決定不要讓這份生氣替你發訊息、做決定或傷害別人。中間那幾秒的停頓，就是自由。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "下一次情緒升高時，先停三秒，做一次慢呼吸，再決定要不要回應。", "question": "今天，我可以在哪一個小選擇上實踐「情緒」？"}, {"theme": "時間", "thought": "真正珍貴的，是你如何使用已經擁有的時間。", "explain": "我們常說「等有時間再做」，卻很少問自己時間究竟被什麼拿走。斯多噶提醒人正視生命有限，不是要你焦慮，而是讓你更清楚：哪些事情值得今天得到你的注意力？\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天刪掉一件不重要、卻會消耗你注意力的事情。", "question": "今天，我可以在哪一個小選擇上實踐「時間」？"}, {"theme": "死亡意識", "thought": "知道生命有限，反而能幫助我們更認真地生活。", "explain": "死亡不是一個需要每天恐懼的念頭，而是一個讓優先順序變清楚的提醒。當你知道時間不是無限供應，就比較不容易把所有力氣花在討好、比較與無止境的擔心上。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "問自己：如果我知道這一年非常珍貴，今天我還會把時間花在同樣的事情上嗎？", "question": "今天，我可以在哪一個小選擇上實踐「死亡意識」？"}, {"theme": "慾望", "thought": "自由的一部分，是不必對每一個想要立刻滿足的衝動做出反應。", "explain": "我們常以為擁有更多就會更自由，但有時候真正的自由，是可以對「我現在就想要」說一句「可以等一下」。延後滿足並不是否定享受，而是在重新取得選擇權。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天選一個小小的慾望，刻意延後十分鐘再決定。", "question": "今天，我可以在哪一個小選擇上實踐「慾望」？"}, {"theme": "名聲", "thought": "別人的評價可以存在，但不必成為你衡量自己的唯一尺度。", "explain": "我們無法控制別人如何理解自己。即使你盡力做好，也可能有人誤會你。若把自我價值交給外界，就等於把內心的方向盤交出去。更穩定的做法，是回到自己的品格與行動。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天做一件正確但不一定有人看見的事。", "question": "今天，我可以在哪一個小選擇上實踐「名聲」？"}, {"theme": "關係", "thought": "你不能控制別人的選擇，但可以控制自己如何對待別人。", "explain": "成熟並不是永遠不生氣，而是在關係裡保留界線與尊重。別人的行為不必決定你的品格。你可以不同意，可以拒絕，也可以離開，同時仍選擇不讓自己變成討厭的那種人。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天在一段關係中，先問一句「你真正想表達的是什麼？」再回應。", "question": "今天，我可以在哪一個小選擇上實踐「關係」？"}, {"theme": "自律", "thought": "小小的選擇重複久了，就會成為你的生活方式。", "explain": "自律不必等於極端。真正穩定的改變，通常來自那些小到幾乎不值得炫耀、卻願意每天重複的行動。與其期待某天突然變得很有意志力，不如把今天的門檻降低到可以完成。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "選一件十分鐘內能完成的好習慣，今天先做一次。", "question": "今天，我可以在哪一個小選擇上實踐「自律」？"}, {"theme": "接受", "thought": "接受已發生的事，不等於喜歡它。", "explain": "接受的意思不是說「這很好」，而是停止與已經發生的事爭辯。事情既然已經發生，否認它只會再消耗一次力氣。接受現實之後，你才能把剩下的力量用在下一步。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "寫下「已經發生的事」，再寫下「我現在能做的一步」。", "question": "今天，我可以在哪一個小選擇上實踐「接受」？"}, {"theme": "勇氣", "thought": "勇氣不是沒有害怕，而是害怕仍然知道什麼值得去做。", "explain": "如果一定要等到完全不害怕才行動，我們很可能永遠不會開始。勇氣比較像是一種選擇：我知道這件事讓我不舒服，但它仍然值得我面對。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天做一件你一直逃避、但其實知道應該面對的小事。", "question": "今天，我可以在哪一個小選擇上實踐「勇氣」？"}, {"theme": "節制", "thought": "真正的節制，是讓你能選擇，而不是讓衝動替你選擇。", "explain": "吃東西、購物、滑手機、工作甚至生氣，都可能變成自動反應。節制不是把生活變得無趣，而是讓你重新感覺到「我可以選」。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天在一個容易失控的習慣前，先問：我真的需要現在就做嗎？", "question": "今天，我可以在哪一個小選擇上實踐「節制」？"}, {"theme": "反省", "thought": "反省不是審判自己，而是重新校準方向。", "explain": "如果每天睡前只問「我今天哪裡做得不好」，很容易變成自責。更有用的問題是：今天什麼做得不錯？哪裡偏離了我想成為的人？明天可以微調哪一步？\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "睡前寫三句：今天值得肯定的事、需要修正的事、明天的一個小行動。", "question": "今天，我可以在哪一個小選擇上實踐「反省」？"}, {"theme": "平靜", "thought": "平靜不是世界沒有噪音，而是你不必對每個噪音都做出反應。", "explain": "生活不會因為修習斯多噶就突然變安靜。訊息仍會來、工作仍會催、別人仍可能讓你失望。真正的平靜，是你逐漸知道哪些事情值得你的反應，哪些事情可以讓它經過。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天收到一個讓你不舒服的訊息，先不要立即回覆，給自己一點距離。", "question": "今天，我可以在哪一個小選擇上實踐「平靜」？"}, {"theme": "比較", "thought": "把自己交給比較，就很難感受到自己正在擁有的生活。", "explain": "我們很容易拿自己的日常與別人的高光時刻比較。問題不只是嫉妒，而是比較會讓注意力離開自己的道路。真正值得問的不是「我比他好嗎」，而是「我今天有沒有比昨天更接近自己想成為的人？」\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "看到讓你羨慕的人時，問：我真正欣賞的是他的哪一點？", "question": "今天，我可以在哪一個小選擇上實踐「比較」？"}, {"theme": "失敗", "thought": "一次結果不好，不等於你這個人不好。", "explain": "斯多噶重視品格與行動，而不是把每一次結果都當成自我價值的判決。失敗可以提供資料：哪裡需要調整？什麼假設錯了？下一次要怎麼做？\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "把最近一次失敗寫成三件事：事實、學到的事、下一次的改變。", "question": "今天，我可以在哪一個小選擇上實踐「失敗」？"}, {"theme": "成功", "thought": "結果值得珍惜，但不要讓結果決定你的全部價值。", "explain": "成功很容易讓人想抓住它，然後開始害怕失去。更穩定的方式，是欣賞結果，同時把注意力放回帶來結果的行動、品格與習慣。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "完成一件事情後，不只問「結果好不好」，也問「我做得對不對？」", "question": "今天，我可以在哪一個小選擇上實踐「成功」？"}, {"theme": "工作", "thought": "專注做好眼前的工作，比反覆擔心最後的結果更有力量。", "explain": "我們常在工作中同時承擔「我要做好」與「別人會怎麼看我」兩種壓力。後者很多時候無法控制。把注意力拉回下一個具體動作，反而更容易把事情做好。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "把今天最重要的工作切成一個 20 分鐘的小區塊，只做第一步。", "question": "今天，我可以在哪一個小選擇上實踐「工作」？"}, {"theme": "金錢", "thought": "金錢可以是工具，但不必成為衡量人生價值的尺度。", "explain": "財富能帶來選擇與安全感，但如果內心認為「更多才代表我夠好」，終點就會不斷後退。斯多噶不是要求人拒絕物質，而是提醒我們不要把幸福完全抵押在外在條件上。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天花錢前問一次：我是因為需要、喜歡，還是想用它證明什麼？", "question": "今天，我可以在哪一個小選擇上實踐「金錢」？"}, {"theme": "孤獨", "thought": "一個人時，你仍然可以與自己的價值站在一起。", "explain": "孤獨有時讓人害怕，因為沒有外界的聲音可以暫時掩蓋內心。但安靜也提供了重新認識自己的機會。你不必永遠被陪伴，才能確定自己正在走的方向。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天留十分鐘不聽音樂、不滑手機，只讓自己安靜坐著。", "question": "今天，我可以在哪一個小選擇上實踐「孤獨」？"}, {"theme": "感恩", "thought": "感恩不是否認問題，而是同時看見仍然存在的好。", "explain": "生活可以有麻煩，也可以有值得珍惜的部分。感恩不是強迫自己樂觀，而是在注意力只盯著缺少的東西時，提醒自己重新看見已經擁有的東西。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天寫下三件普通、甚至微小，但值得感謝的事。", "question": "今天，我可以在哪一個小選擇上實踐「感恩」？"}, {"theme": "他人", "thought": "很多人讓你困擾，是因為他們正在用自己的理解活著。", "explain": "這不代表你必須接受不合理的行為，而是提醒你：別人的性格、習慣與判斷不完全由你塑造。理解這一點，可以少一點「為什麼他不照我想的做」的消耗。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "遇到難相處的人時，問：我可以設什麼界線，而不是怎麼改變他？", "question": "今天，我可以在哪一個小選擇上實踐「他人」？"}, {"theme": "失去", "thought": "有些東西之所以珍貴，正因為它們不會永遠存在。", "explain": "我們往往只有在失去時才真正注意到擁有過的東西。這個練習不是要你提前悲傷，而是讓你在還擁有的時候多一點珍惜。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天看一個你習以為常的人或物，花一分鐘認真感受它存在於你生活中的意義。", "question": "今天，我可以在哪一個小選擇上實踐「失去」？"}, {"theme": "期待", "thought": "期待越多，越容易把平靜交給外在結果。", "explain": "期待本身沒有錯，但如果我們把「事情必須照我的劇本」當成幸福的前提，就很容易被現實牽著走。可以有目標，同時為結果保留彈性。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "寫下今天一個期待，旁邊補一句：「如果結果不同，我仍然可以怎麼做？」", "question": "今天，我可以在哪一個小選擇上實踐「期待」？"}, {"theme": "界線", "thought": "接受別人不是沒有界線，溫柔也不等於無限退讓。", "explain": "斯多噶強調自己的品格與選擇，也意味著你可以清楚地說不。健康的界線不是懲罰別人，而是把自己的責任範圍說清楚。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天找一件你其實不想答應的事，練習用簡單、尊重的方式說不。", "question": "今天，我可以在哪一個小選擇上實踐「界線」？"}, {"theme": "耐心", "thought": "很多值得的事情，都需要時間才能看見結果。", "explain": "焦躁常常來自希望現在就得到未來的答案。但成長、關係、工作與習慣都需要累積。耐心不是什麼都不做，而是在持續行動時，不要求成果立刻出現。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "選一件正在累積的事情，今天只做下一個小步驟，不檢查結果。", "question": "今天，我可以在哪一個小選擇上實踐「耐心」？"}, {"theme": "簡化", "thought": "不是所有事情都值得你的注意力。", "explain": "成熟的一部分，是知道什麼可以放下。資訊、意見、社群、工作與選擇越來越多，如果每件事都要回應，注意力很快就被耗盡。簡化不是少過生活，而是更清楚地選擇。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天刪除或關閉一個不必要的通知、追蹤或資訊來源。", "question": "今天，我可以在哪一個小選擇上實踐「簡化」？"}, {"theme": "方向", "thought": "過好人生，不只是問自己想得到什麼，也要問自己想成為什麼樣的人。", "explain": "目標可以告訴你要去哪裡，但品格決定你用什麼方式抵達。當結果不完全由你控制時，仍然可以選擇誠實、勇敢、節制與善意。這些才是比較不容易被拿走的東西。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "問自己：如果今天只留下一個品格，我希望別人記得我是怎樣的人？", "question": "今天，我可以在哪一個小選擇上實踐「方向」？"}, {"theme": "重新開始", "thought": "昨天沒有做好，不代表今天不能重新選擇。", "explain": "斯多噶的練習不是要求完美，而是一次又一次把自己帶回正軌。你可能失控、拖延、說錯話，也可能做出後悔的決定；重要的是看見它、修正它，然後繼續。\n\n把這個想法帶進今天，不求一次做到，只求比昨天多一點清醒。", "practice": "今天挑一件昨天沒有做到的事，不批評自己，只重新開始。", "question": "今天，我可以在哪一個小選擇上實踐「重新開始」？"}, {"theme": "控制二分法", "thought": "把注意力放在能由你決定的部分。", "explain": "斯多噶思想最實用的一個起點，是分清楚「我能控制什麼」與「我不能控制什麼」。別人的看法、已經發生的事情、結果是否符合期待，往往不完全由你決定；但你的判斷、選擇與下一個行動，仍然在你手中。當你把力氣從不可控的地方收回來，心就會多一點空間。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "今天遇到一件讓你不舒服的事，寫下：我無法控制的是什麼？我現在仍能做的是什麼？", "question": "今天，我可以在哪一個小選擇上實踐「控制二分法」？"}, {"theme": "當下", "thought": "人生只能在此刻被活出來。", "explain": "我們很容易把今天交給昨天的後悔，或交給明天的擔心。可是過去不能重新操作，未來也還沒有真正發生。斯多噶不是叫人停止規劃，而是提醒我們：規劃未來之後，仍要把注意力帶回正在發生的這一刻。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "今天挑一件日常小事，刻意不滑手機、不分心，只做眼前這件事。", "question": "今天，我可以在哪一個小選擇上實踐「當下」？"}, {"theme": "判斷", "thought": "事情本身與我們對事情的解讀，不是同一件事。", "explain": "有人沒有回訊息是一個事實；「他一定討厭我」卻是一個推論。情緒常常不是直接由事件產生，而是被我們附加在事件上的意義放大。先把事實與故事拆開，你才有機會選擇比較穩定的回應。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "遇到情緒時，寫兩行：事實是什麼？我的解讀又是什麼？", "question": "今天，我可以在哪一個小選擇上實踐「判斷」？"}, {"theme": "逆境", "thought": "困難不一定是人生的偏離，也可以成為鍛鍊的材料。", "explain": "我們通常希望道路平坦，但真正能訓練耐心、勇氣、判斷力與韌性的，往往正是那些不順利的時刻。這不是要你喜歡痛苦，而是把已經發生的阻礙轉換成可以使用的訓練場。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "今天遇到阻礙時，問自己：這件事正在訓練我的哪一種能力？", "question": "今天，我可以在哪一個小選擇上實踐「逆境」？"}, {"theme": "情緒", "thought": "情緒可以被看見，但不必立刻被服從。", "explain": "憤怒、焦慮與失望都是真實的感受，但感受本身不等於命令。你可以承認「我現在很生氣」，同時決定不要讓這份生氣替你發訊息、做決定或傷害別人。中間那幾秒的停頓，就是自由。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "下一次情緒升高時，先停三秒，做一次慢呼吸，再決定要不要回應。", "question": "今天，我可以在哪一個小選擇上實踐「情緒」？"}, {"theme": "時間", "thought": "真正珍貴的，是你如何使用已經擁有的時間。", "explain": "我們常說「等有時間再做」，卻很少問自己時間究竟被什麼拿走。斯多噶提醒人正視生命有限，不是要你焦慮，而是讓你更清楚：哪些事情值得今天得到你的注意力？\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "今天刪掉一件不重要、卻會消耗你注意力的事情。", "question": "今天，我可以在哪一個小選擇上實踐「時間」？"}, {"theme": "死亡意識", "thought": "知道生命有限，反而能幫助我們更認真地生活。", "explain": "死亡不是一個需要每天恐懼的念頭，而是一個讓優先順序變清楚的提醒。當你知道時間不是無限供應，就比較不容易把所有力氣花在討好、比較與無止境的擔心上。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "問自己：如果我知道這一年非常珍貴，今天我還會把時間花在同樣的事情上嗎？", "question": "今天，我可以在哪一個小選擇上實踐「死亡意識」？"}, {"theme": "慾望", "thought": "自由的一部分，是不必對每一個想要立刻滿足的衝動做出反應。", "explain": "我們常以為擁有更多就會更自由，但有時候真正的自由，是可以對「我現在就想要」說一句「可以等一下」。延後滿足並不是否定享受，而是在重新取得選擇權。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "今天選一個小小的慾望，刻意延後十分鐘再決定。", "question": "今天，我可以在哪一個小選擇上實踐「慾望」？"}, {"theme": "名聲", "thought": "別人的評價可以存在，但不必成為你衡量自己的唯一尺度。", "explain": "我們無法控制別人如何理解自己。 而是「我今天有沒有比昨天更接近自己想成為的人？」\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "看到讓你羨慕的人時，問：我真正欣賞的是他的哪一點？", "question": "今天，我可以在哪一個小選擇上實踐「比較」？"}, {"theme": "失敗", "thought": "一次結果不好，不等於你這個人不好。", "explain": "斯多噶重視品格與行動，而不是把每一次結果都當成自我價值的判決。失敗可以提供資料：哪裡需要調整？什麼假設錯了？下一次要怎麼做？\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "把最近一次失敗寫成三件事：事實、學到的事、下一次的改變。", "question": "今天，我可以在哪一個小選擇上實踐「失敗」？"}, {"theme": "成功", "thought": "結果值得珍惜，但不要讓結果決定你的全部價值。", "explain": "成功很容易讓人想抓住它，然後開始害怕失去。更穩定的方式，是欣賞結果，同時把注意力放回帶來結果的行動、品格與習慣。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "完成一件事情後，不只問「結果好不好」，也問「我做得對不對？」", "question": "今天，我可以在哪一個小選擇上實踐「成功」？"}, {"theme": "工作", "thought": "專注做好眼前的工作，比反覆擔心最後的結果更有力量。", "explain": "我們常在工作中同時承擔「我要做好」與「別人會怎麼看我」兩種壓力。後者很多時候無法控制。把注意力拉回下一個具體動作，反而更容易把事情做好。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "把今天最重要的工作切成一個 20 分鐘的小區塊，只做第一步。", "question": "今天，我可以在哪一個小選擇上實踐「工作」？"}, {"theme": "金錢", "thought": "金錢可以是工具，但不必成為衡量人生價值的尺度。", "explain": "財富能帶來選擇與安全感，但如果內心認為「更多才代表我夠好」，終點就會不斷後退。斯多噶不是要求人拒絕物質，而是提醒我們不要把幸福完全抵押在外在條件上。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "今天花錢前問一次：我是因為需要、喜歡，還是想用它證明什麼？", "question": "今天，我可以在哪一個小選擇上實踐「金錢」？"}, {"theme": "孤獨", "thought": "一個人時，你仍然可以與自己的價值站在一起。", "explain": "孤獨有時讓人害怕，因為沒有外界的聲音可以暫時掩蓋內心。但安靜也提供了重新認識自己的機會。你不必永遠被陪伴，才能確定自己正在走的方向。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "今天留十分鐘不聽音樂、不滑手機，只讓自己安靜坐著。", "question": "今天，我可以在哪一個小選擇上實踐「孤獨」？"}, {"theme": "感恩", "thought": "感恩不是否認問題，而是同時看見仍然存在的好。", "explain": "生活可以有麻煩，也可以有值得珍惜的部分。感恩不是強迫自己樂觀，而是在注意力只盯著缺少的東西時，提醒自己重新看見已經擁有的東西。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "今天寫下三件普通、甚至微小，但值得感謝的事。", "question": "今天，我可以在哪一個小選擇上實踐「感恩」？"}, {"theme": "他人", "thought": "很多人讓你困擾，是因為他們正在用自己的理解活著。", "explain": "這不代表你必須接受不合理的行為，而是提醒你：別人的性格、習慣與判斷不完全由你塑造。理解這一點，可以少一點「為什麼他不照我想的做」的消耗。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "遇到難相處的人時，問：我可以設什麼界線，而不是怎麼改變他？", "question": "今天，我可以在哪一個小選擇上實踐「他人」？"}, {"theme": "失去", "thought": "有些東西之所以珍貴，正因為它們不會永遠存在。", "explain": "我們往往只有在失去時才真正注意到擁有過的東西。這個練習不是要你提前悲傷，而是讓你在還擁有的時候多一點珍惜。\n\n今天不必追求完美；只要在一個小選擇上練習它。", "practice": "今天看一個你習以為常的人或物，花一分鐘認真感 那種人。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "今天在一段關係中，先問一句「你真正想表達的是什麼？」再回應。", "question": "今天，我可以在哪一個小選擇上實踐「關係」？"}, {"theme": "自律", "thought": "小小的選擇重複久了，就會成為你的生活方式。", "explain": "自律不必等於極端。真正穩定的改變，通常來自那些小到幾乎不值得炫耀、卻願意每天重複的行動。與其期待某天突然變得很有意志力，不如把今天的門檻降低到可以完成。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "選一件十分鐘內能完成的好習慣，今天先做一次。", "question": "今天，我可以在哪一個小選擇上實踐「自律」？"}, {"theme": "接受", "thought": "接受已發生的事，不等於喜歡它。", "explain": "接受的意思不是說「這很好」，而是停止與已經發生的事爭辯。事情既然已經發生，否認它只會再消耗一次力氣。接受現實之後，你才能把剩下的力量用在下一步。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "寫下「已經發生的事」，再寫下「我現在能做的一步」。", "question": "今天，我可以在哪一個小選擇上實踐「接受」？"}, {"theme": "勇氣", "thought": "勇氣不是沒有害怕，而是害怕仍然知道什麼值得去做。", "explain": "如果一定要等到完全不害怕才行動，我們很可能永遠不會開始。勇氣比較像是一種選擇：我知道這件事讓我不舒服，但它仍然值得我面對。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "今天做一件你一直逃避、但其實知道應該面對的小事。", "question": "今天，我可以在哪一個小選擇上實踐「勇氣」？"}, {"theme": "節制", "thought": "真正的節制，是讓你能選擇，而不是讓衝動替你選擇。", "explain": "吃東西、購物、滑手機、工作甚至生氣，都可能變成自動反應。節制不是把生活變得無趣，而是讓你重新感覺到「我可以選」。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "今天在一個容易失控的習慣前，先問：我真的需要現在就做嗎？", "question": "今天，我可以在哪一個小選擇上實踐「節制」？"}, {"theme": "反省", "thought": "反省不是審判自己，而是重新校準方向。", "explain": "如果每天睡前只問「我今天哪裡做得不好」，很容易變成自責。更有用的問題是：今天什麼做得不錯？哪裡偏離了我想成為的人？明天可以微調哪一步？\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "睡前寫三句：今天值得肯定的事、需要修正的事、明天的一個小行動。", "question": "今天，我可以在哪一個小選擇上實踐「反省」？"}, {"theme": "平靜", "thought": "平靜不是世界沒有噪音，而是你不必對每個噪音都做出反應。", "explain": "生活不會因為修習斯多噶就突然變安靜。訊息仍會來、工作仍會催、別人仍可能讓你失望。真正的平靜，是你逐漸知道哪些事情值得你的反應，哪些事情可以讓它經過。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "今天收到一個讓你不舒服的訊息，先不要立即回覆，給自己一點距離。", "question": "今天，我可以在哪一個小選擇上實踐「平靜」？"}, {"theme": "比較", "thought": "把自己交給比較，就很難感受到自己正在擁有的生活。", "explain": "我們很容易拿自己的日常與別人的高光時刻比較。問題不只是嫉妒，而是比較會讓注意力離開自己的道路。真正值得問的不是「我比他好嗎」，而是「我今天有沒有比昨天更接近自己想成為的人？」\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "看到讓你羨慕的人時，問：我真正欣賞的是他的哪一點？", "question": "今天，我可以在哪一個小選擇上實踐「比較」？"}, {"theme": "失敗", "thought": "一次結果不好，不等於你這個人不好。", "explain": "斯多噶重視品格與行動，而不是把每一次結果都當成自我價值的判決。失敗可以提供資料：哪裡需要調整？什麼假設錯了？下一次要怎麼做？\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "把最近一次失敗寫成三件事：事實、學到的事、下一次的改變。", "question": "今天，我可以在哪一個小選擇上實踐「失敗」？"}, {"theme": "成功", "thought": "結果值得珍惜，但不要讓結果決定你的全部價值。", "explain": "成功很容易讓人想抓住它，然後開始害怕失去。更穩定的方式，是欣賞結果，同時把注意力放回帶來結果的行動、品格與習慣。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "完成一件事情後，不只問「結果好不好」，也問「我做得對不對？」", "question": "今天，我可以在哪一個小選擇上實踐「成功」？"}, {"theme": "工作", "thought": "專注做好眼前的工作，比反覆擔心最後的結果更有力量。", "explain": "我們常在工作中同時承擔「我要做好」與「別人會怎麼看我」兩種壓力。後者很多時候無法控制。把注意力拉回下一個具體動作，反而更容易把事情做好。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "把今天最重要的工作切成一個 20 分鐘的小區塊，只做第一步。", "question": "今天，我可以在哪一個小選擇上實踐「工作」？"}, {"theme": "金錢", "thought": "金錢可以是工具，但不必成為衡量人生價值的尺度。", "explain": "財富能帶來選擇與安全感，但如果內心認為「更多才代表我夠好」，終點就會不斷後退。斯多噶不是要求人拒絕物質，而是提醒我們不要把幸福完全抵押在外在條件上。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "今天花錢前問一次：我是因為需要、喜歡，還是想用它證明什麼？", "question": "今天，我可以在哪一個小選擇上實踐「金錢」？"}, {"theme": "孤獨", "thought": "一個人時，你仍然可以與自己的價值站在一起。", "explain": "孤獨有時讓人害怕，因為沒有外界的聲音可以暫時掩蓋內心。但安靜也提供了重新認識自己的機會。你不必永遠被陪伴，才能確定自己正在走的方向。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "今天留十分鐘不聽音樂、不滑手機，只讓自己安靜坐著。", "question": "今天，我可以在哪一個小選擇上實踐「孤獨」？"}, {"theme": "感恩", "thought": "感恩不是否認問題，而是同時看見仍然存在的好。", "explain": "生活可以有麻煩，也可以有值得珍惜的部分。感恩不是強迫自己樂觀，而是在注意力只盯著缺少的東西時，提醒自己重新看見已經擁有的東西。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "今天寫下三件普通、甚至微小，但值得感謝的事。", "question": "今天，我可以在哪一個小選擇上實踐「感恩」？"}, {"theme": "他人", "thought": "很多人讓你困擾，是因為他們正在用自己的理解活著。", "explain": "這不代表你必須接受不合理的行為，而是提醒你：別人的性格、習慣與判斷不完全由你塑造。理解這一點，可以少一點「為什麼他不照我想的做」的消耗。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "遇到難相處的人時，問：我可以設什麼界線，而不是怎麼改變他？", "question": "今天，我可以在哪一個小選擇上實踐「他人」？"}, {"theme": "失去", "thought": "有些東西之所以珍貴，正因為它們不會永遠存在。", "explain": "我們往往只有在失去時才真正注意到擁有過的東西。這個練習不是要你提前悲傷，而是讓你在還擁有的時候多一點珍惜。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "今天看一個你習以為常的人或物，花一分鐘認真感受它存在於你生活中的意義。", "question": "今天，我可以在哪一個小選擇上實踐「失去」？"}, {"theme": "期待", "thought": "期待越多，越容易把平靜交給外在結果。", "explain": "期待本身沒有錯，但如果我們把「事情必須照我的劇本」當成幸福的前提，就很容易被現實牽著走。可以有目標，同時為結果保留彈性。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "寫下今天一個期待，旁邊補一句：「如果結果不同，我仍然可以怎麼做？」", "question": "今天，我可以在哪一個小選擇上實踐「期待」？"}, {"theme": "界線", "thought": "接受別人不是沒有界線，溫柔也不等於無限退讓。", "explain": "斯多噶強調自己的品格與選擇，也意味著你可以清楚地說不。健康的界線不是懲罰別人，而是把自己的責任範圍說清楚。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "今天找一件你其實不想答應的事，練習用簡單、尊重的方式說不。", "question": "今天，我可以在哪一個小選擇上實踐「界線」？"}, {"theme": "耐心", "thought": "很多值得的事情，都需要時間才能看見結果。", "explain": "焦躁常常來自希望現在就得到未來的答案。但成長、關係、工作與習慣都需要累積。耐心不是什麼都不做，而是在持續行動時，不要求成果立刻出現。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "選一件正在累積的事情，今天只做下一個小步驟，不檢查結果。", "question": "今天，我可以在哪一個小選擇上實踐「耐心」？"}, {"theme": "簡化", "thought": "不是所有事情都值得你的注意力。", "explain": "成熟的一部分，是知道什麼可以放下。資訊、意見、社群、工作與選擇越來越多，如果每件事都要回應，注意力很快就被耗盡。簡化不是少過生活，而是更清楚地選擇。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "今天刪除或關閉一個不必要的通知、追蹤或資訊來源。", "question": "今天，我可以在哪一個小選擇上實踐「簡化」？"}, {"theme": "方向", "thought": "過好人生，不只是問自己想得到什麼，也要問自己想成為什麼樣的人。", "explain": "目標可以告訴你要去哪裡，但品格決定你用什麼方式抵達。當結果不完全由你控制時，仍然可以選擇誠實、勇敢、節制與善意。這些才是比較不容易被拿走的東西。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "問自己：如果今天只留下一個品格，我希望別人記得我是怎樣的人？", "question": "今天，我可以在哪一個小選擇上實踐「方向」？"}, {"theme": "重新開始", "thought": "昨天沒有做好，不代表今天不能重新選擇。", "explain": "斯多噶的練習不是要求完美，而是一次又一次把自己帶回正軌。你可能失控、拖延、說錯話，也可能做出後悔的決定；重要的是看見它、修正它，然後繼續。\n\n把它放到一個真實情境裡，你會更容易看見自己的選擇空間。", "practice": "今天挑一件昨天沒有做到的事，不批評自己，只重新開始。", "question": "今天，我可以在哪一個小選擇上實踐「重新開始」？"}, {"theme": "控制二分法", "thought": "把注意力放在能由你決定的部分。", "explain": "斯多噶思想最實用的一個起點，是分清楚「我能控制什麼」與「我不能控制什麼」。別人的看法、已經發生的事情、結果是否符合期待，往往不完全由你決定；但你的判斷、選擇與下一個行動，仍然在你手中。當你把力氣從不可控的地方收回來，心就會多一點空間。\n\n如果今天遇到阻力，記得先處理能處理的部分，再放下其餘的。", "practice": "今天遇到一件讓你不舒服的事，寫下：我無法控制的是什麼？我現在仍能做的是什麼？", "question": "今天，我可以在哪一個小選擇上實踐「控制二分法」？"}, {"theme": "當下", "thought": "人生只能在此刻被活出來。", "explain": "我們很容易把今天交給昨天的後悔，或交給明天的擔心。可是過去不能重新操作，未來也還沒有真正發生。斯多噶不是叫人停止規劃，而是提醒我們：規劃未來之後，仍要把注意力帶回正在發生的這一刻。\n\n如果今天遇到阻力，記得先處理能處理的部分，再放下其餘的。", "practice": "今天挑一件日常小事，刻意不滑手機、不分心，只做眼前這件事。", "question": "今天，我可以在哪一個小選擇上實踐「當下」？"}, {"theme": "判斷", "thought": "事情本身與我們對事情的解讀，不是同一件事。", "explain": "有人沒有回訊息是一個事實；「他一定討厭我」卻是一個推論。情緒常常不是直接由事件產生，而是被我們附加在事件上的意義放大。先把事實與故事拆開，你才有機會選擇比較穩定的回應。\n\n如果今天遇到阻力，記得先處理能處理的部分，再放下其餘的。", "practice": "遇到情緒時，寫兩行：事實是什麼？我的解讀又是什麼？", "question": "今天，我可以在哪一個小選擇上實踐「判斷」？"}, {"theme": "逆境", "thought": "困難不一定是人生的偏離，也可以成為鍛鍊的材料。", "explain": "我們通常希望道路平坦，但真正能訓練耐心、勇氣、判斷力與韌性的，往往正是那些不順利的時刻。這不是要你喜歡痛苦，而是把已經發生的阻礙轉換成可以使用的訓練場。\n\n如果今天遇到阻力，記得先處理能處理的部分，再放下其餘的。", "practice": "今天遇到阻礙時，問自己：這件事正在訓練我的哪一種能力？", "question": "今天，我可以在哪一個小選擇上實踐「逆境」？"}, {"theme": "情緒", "thought": "情緒可以被看見，但不必立刻被服從。", "explain": "憤怒、焦慮與失望都是真實的感受，但感受本身不等於命令。你可以承認「我現在很生氣」，同時決定不要讓這份生氣替你發訊息、做決定或傷害別人。中間那幾秒的停頓，就是自由。\n\n如果今天遇到阻力，記得先處理能處理的部分，再放下其餘的。", "practice": "下一次情緒升高時，先停三秒，做一次慢呼吸，再決定要不要回應。", "question": "今天，我可以在哪一個小選擇上實踐「情緒」？"}, {"theme": "時間", "thought": "真正珍貴的，是你如何使用已經擁有的時間。", "explain": "我們常說「等有時間再做」，卻很少問自己時間究竟被什麼拿走。斯多噶提醒人正視生命有限，不是要你焦慮，而是讓你更清楚：哪些事情值得今天得到你的注意力？\n\n如果今天遇到阻力，記得先處理能處理的部分，再放下其餘的。", "practice": "今天刪掉一件不重要、卻會消耗你注意力的事情。", "question": "今天，我可以在哪一個小選擇上實踐「時間」？"}, {"theme": "死亡意識", "thought": "知道生命有限，反而能幫助我們更認真地生活。", "explain": "死亡不是一個需要每天恐懼的念頭，而是一個讓優先順序變清楚的提醒。當你知道時間不是無限供應，就比較不容易把所有力氣花在討好、比較與無止境的擔心上。\n\n如果今天遇到阻力，記得先處理能處理的部分，再放下其餘的。", "practice": "問自己：如果我知道這一年非常珍貴，今天我還會把時間花在同樣的事情上嗎？", "question": "今天，我可以在哪一個小選擇上實踐「死亡意識」？"}, {"theme": "慾望", "thought": "自由的一部分，是不必對每一個想要立刻滿足的衝動做出反應。", "explain": "我們常以為擁有更多就會更自由，但有時候真正的自由，是可以對「我現在就想要」說一句「可以等一下」。延後滿足並不是否定享受，而是在重新取得選擇權。\n\n如果今天遇到阻力，記得先處理能處理的部分，再放下其餘的。", "practice": "今天選一個小小的慾望，刻意延後十分鐘再決定。", "question": "今天，我可以在哪一個小選擇上實踐「慾望」？"}, {"theme": "名聲", "thought": "別人的評價可以存在，但不必成為你衡量自己的唯一尺度。", "explain": "我們無法控制別人如何理解自己。即使你盡力做好，也可能有人誤會你。若把自我價值交給外界，就等於把內心的方向盤交出去。更穩定的做法，是回到自己的品格與行動。\n\n如果今天遇到阻力，記得先處理能處理的部分，再放下其餘的。", "practice": "今天做一件正確但不一定有人看見的事。", "question": "今天，我可以在哪一個小選擇上實踐「名聲」？"}, {"theme": "關係", "thought": "你不能控制別人的選擇，但可以控制自己如何對待別人。", "explain": "成熟並不是永遠不生氣，而是在關係裡保留界線與尊重。別人的行為不必決定你的品格。你可以不同意，可以拒絕，也可以離開，同時仍選擇不讓自己變成討厭的那種人。\n\n如果今天遇到阻力，記得先處理能處理的部分，再放下其餘的。", "practice": "今天在一段關係中，先問一句「你真正想表達的是什麼？」再回應。", "question": "今天，我可以在哪一個小選擇上實踐「關係」？"}, {"theme": "自律", "thought": "小小的選擇重複久了，就會成為你的生活方式。", "explai 踐「自律」？"}, {"theme": "接受", "thought": "接受已發生的事，不等於喜歡它。", "explain": "接受的意思不是說「這很好」，而是停止與已經發生的事爭辯。事情既然已經發生，否認它只會再消耗一次力氣。接受現實之後，你才能把剩下的力量用在下一步。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "寫下「已經發生的事」，再寫下「我現在能做的一步」。", "question": "今天，我可以在哪一個小選擇上實踐「接受」？"}, {"theme": "勇氣", "thought": "勇氣不是沒有害怕，而是害怕仍然知道什麼值得去做。", "explain": "如果一定要等到完全不害怕才行動，我們很可能永遠不會開始。勇氣比較像是一種選擇：我知道這件事讓我不舒服，但它仍然值得我面對。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "今天做一件你一直逃避、但其實知道應該面對的小事。", "question": "今天，我可以在哪一個小選擇上實踐「勇氣」？"}, {"theme": "節制", "thought": "真正的節制，是讓你能選擇，而不是讓衝動替你選擇。", "explain": "吃東西、購物、滑手機、工作甚至生氣，都可能變成自動反應。節制不是把生活變得無趣，而是讓你重新感覺到「我可以選」。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "今天在一個容易失控的習慣前，先問：我真的需要現在就做嗎？", "question": "今天，我可以在哪一個小選擇上實踐「節制」？"}, {"theme": "反省", "thought": "反省不是審判自己，而是重新校準方向。", "explain": "如果每天睡前只問「我今天哪裡做得不好」，很容易變成自責。更有用的問題是：今天什麼做得不錯？哪裡偏離了我想成為的人？明天可以微調哪一步？\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "睡前寫三句：今天值得肯定的事、需要修正的事、明天的一個小行動。", "question": "今天，我可以在哪一個小選擇上實踐「反省」？"}, {"theme": "平靜", "thought": "平靜不是世界沒有噪音，而是你不必對每個噪音都做出反應。", "explain": "生活不會因為修習斯多噶就突然變安靜。訊息仍會來、工作仍會催、別人仍可能讓你失望。真正的平靜，是你逐漸知道哪些事情值得你的反應，哪些事情可以讓它經過。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "今天收到一個讓你不舒服的訊息，先不要立即回覆，給自己一點距離。", "question": "今天，我可以在哪一個小選擇上實踐「平靜」？"}, {"theme": "比較", "thought": "把自己交給比較，就很難感受到自己正在擁有的生活。", "explain": "我們很容易拿自己的日常與別人的高光時刻比較。問題不只是嫉妒，而是比較會讓注意力離開自己的道路。真正值得問的不是「我比他好嗎」，而是「我今天有沒有比昨天更接近自己想成為的人？」\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "看到讓你羨慕的人時，問：我真正欣賞的是他的哪一點？", "question": "今天，我可以在哪一個小選擇上實踐「比較」？"}, {"theme": "失敗", "thought": "一次結果不好，不等於你這個人不好。", "explain": "斯多噶重視品格與行動，而不是把每一次結果都當成自我價值的判決。失敗可以提供資料：哪裡需要調整？什麼假設錯了？下一次要怎麼做？\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "把最近一次失敗寫成三件事：事實、學到的事、下一次的改變。", "question": "今天，我可以在哪一個小選擇上實踐「失敗」？"}, {"theme": "成功", "thought": "結果值得珍惜，但不要讓結果決定你的全部價值。", "explain": "成功很容易讓人想抓住它，然後開始害怕失去。更穩定的方式，是欣賞結果，同時把注意力放回帶來結果的行動、品格與習慣。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "完成一件事情後，不只問「結果好不好」，也問「我做得對不對？」", "question": "今天，我可以在哪一個小選擇上實踐「成功」？"}, {"theme": "工作", "thought": "專注做好眼前的工作，比反覆擔心最後的結果更有力量。", "explain": "我們常在工作中同時承擔「我要做好」與「別人會怎麼看我」兩種壓力。後者很多時候無法控制。把注意力拉回下一個具體動作，反而更容易把事情做好。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "把今天最重要的工作切成一個 20 分鐘的小區塊，只做第一步。", "question": "今天，我可以在哪一個小選擇上實踐「工作」？"}, {"theme": "金錢", "thought": "金錢可以是工具，但不必成為衡量人生價值的尺度。", "explain": "財富能帶來選擇與安全感，但如果內心認為「更多才代表我夠好」，終點就會不斷後退。斯多噶不是要求人拒絕物質，而是提醒我們不要把幸福完全抵押在外在條件上。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "今天花錢前問一次：我是因為需要、喜歡，還是想用它證明什麼？", "question": "今天，我可以在哪一個小選擇上實踐「金錢」？"}, {"theme": "孤獨", "thought": "一個人時，你仍然可以與自己的價值站在一起。", "explain": "孤獨有時讓人害怕，因為沒有外界的聲音可以暫時掩蓋內心。但安靜也提供了重新認識自己的機會。你不必永遠被陪伴，才能確定自己正在走的方向。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "今天留十分鐘不聽音樂、不滑手機，只讓自己安靜坐著。", "question": "今天，我可以在哪一個小選擇上實踐「孤獨」？"}, {"theme": "感恩", "thought": "感恩不是否認問題，而是同時看見仍然存在的好。", "explain": "生活可以有麻煩，也可以有值得珍惜的部分。感恩不是強迫自己樂觀，而是在注意力只盯著缺少的東西時，提醒自己重新看見已經擁有的東西。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "今天寫下三件普通、甚至微小，但值得感謝的事。", "question": "今天，我可以在哪一個小選擇上實踐「感恩」？"}, {"theme": "他人", "thought": "很多人讓你困擾，是因為他們正在用自己的理解活著。", "explain": "這不代表你必須接受不合理的行為，而是提醒你：別人的性格、習慣與判斷不完全由你塑造。理解這一點，可以少一點「為什麼他不照我想的做」的消耗。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "遇到難相處的人時，問：我可以設什麼界線，而不是怎麼改變他？", "question": "今天，我可以在哪一個小選擇上實踐「他人」？"}, {"theme": "失去", "thought": "有些東西之所以珍貴，正因為它們不會永遠存在。", "explain": "我們往往只有在失去時才真正注意到擁有過的東西。這個練習不是要你提前悲傷，而是讓你在還擁有的時候多一點珍惜。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "今天看一個你習以為常的人或物，花一分鐘認真感受它存在於你生活中的意義。", "question": "今天，我可以在哪一個小選擇上實踐「失去」？"}, {"theme": "期待", "thought": "期待越多，越容易把平靜交給外在結果。", "explain": "期待本身沒有錯，但如果我們把「事情必須照我的劇本」當成幸福的前提，就很容易被現實牽著走。可以有目標，同時為結果保留彈性。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "寫下今天一個期待，旁邊補一句：「如果結果不同，我仍然可以怎麼做？」", "question": "今天，我可以在哪一個小選擇上實踐「期待」？"}, {"theme": "界線", "thought": "接受別人不是沒有界線，溫柔也不等於無限退讓。", "explain": "斯多噶強調自己的品格與選擇，也意味著你可以清楚地說不。健康的界線不是懲罰別人，而是把自己的責任範圍說清楚。\n\n這不是要求你壓抑自己，而是讓你多一個回應之前的選擇。", "practice": "今天找一件你其實不想答應的事，練習用簡單、尊重的方式說不。", "question": "今天，我可以在哪一個小選擇上實踐「界線」？"}, {"theme": "耐心", "thought": "很多值得的事情，都需要時間才能看見結果。", "explain": "焦躁常常來 : "今天，我可以在哪一個小選擇上實踐「情緒」？"}, {"theme": "時間", "thought": "真正珍貴的，是你如何使用已經擁有的時間。", "explain": "我們常說「等有時間再做」，卻很少問自己時間究竟被什麼拿走。斯多噶提醒人正視生命有限，不是要你焦慮，而是讓你更清楚：哪些事情值得今天得到你的注意力？\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天刪掉一件不重要、卻會消耗你注意力的事情。", "question": "今天，我可以在哪一個小選擇上實踐「時間」？"}, {"theme": "死亡意識", "thought": "知道生命有限，反而能幫助我們更認真地生活。", "explain": "死亡不是一個需要每天恐懼的念頭，而是一個讓優先順序變清楚的提醒。當你知道時間不是無限供應，就比較不容易把所有力氣花在討好、比較與無止境的擔心上。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "問自己：如果我知道這一年非常珍貴，今天我還會把時間花在同樣的事情上嗎？", "question": "今天，我可以在哪一個小選擇上實踐「死亡意識」？"}, {"theme": "慾望", "thought": "自由的一部分，是不必對每一個想要立刻滿足的衝動做出反應。", "explain": "我們常以為擁有更多就會更自由，但有時候真正的自由，是可以對「我現在就想要」說一句「可以等一下」。延後滿足並不是否定享受，而是在重新取得選擇權。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天選一個小小的慾望，刻意延後十分鐘再決定。", "question": "今天，我可以在哪一個小選擇上實踐「慾望」？"}, {"theme": "名聲", "thought": "別人的評價可以存在，但不必成為你衡量自己的唯一尺度。", "explain": "我們無法控制別人如何理解自己。即使你盡力做好，也可能有人誤會你。若把自我價值交給外界，就等於把內心的方向盤交出去。更穩定的做法，是回到自己的品格與行動。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天做一件正確但不一定有人看見的事。", "question": "今天，我可以在哪一個小選擇上實踐「名聲」？"}, {"theme": "關係", "thought": "你不能控制別人的選擇，但可以控制自己如何對待別人。", "explain": "成熟並不是永遠不生氣，而是在關係裡保留界線與尊重。別人的行為不必決定你的品格。你可以不同意，可以拒絕，也可以離開，同時仍選擇不讓自己變成討厭的那種人。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天在一段關係中，先問一句「你真正想表達的是什麼？」再回應。", "question": "今天，我可以在哪一個小選擇上實踐「關係」？"}, {"theme": "自律", "thought": "小小的選擇重複久了，就會成為你的生活方式。", "explain": "自律不必等於極端。真正穩定的改變，通常來自那些小到幾乎不值得炫耀、卻願意每天重複的行動。與其期待某天突然變得很有意志力，不如把今天的門檻降低到可以完成。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "選一件十分鐘內能完成的好習慣，今天先做一次。", "question": "今天，我可以在哪一個小選擇上實踐「自律」？"}, {"theme": "接受", "thought": "接受已發生的事，不等於喜歡它。", "explain": "接受的意思不是說「這很好」，而是停止與已經發生的事爭辯。事情既然已經發生，否認它只會再消耗一次力氣。接受現實之後，你才能把剩下的力量用在下一步。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "寫下「已經發生的事」，再寫下「我現在能做的一步」。", "question": "今天，我可以在哪一個小選擇上實踐「接受」？"}, {"theme": "勇氣", "thought": "勇氣不是沒有害怕，而是害怕仍然知道什麼值得去做。", "explain": "如果一定要等到完全不害怕才行動，我們很可能永遠不會開始。勇氣比較像是一種選擇：我知道這件事讓我不舒服，但它仍然值得我面對。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天做一件你一直逃避、但其實知道應該面對的小事。", "question": "今天，我可以在哪一個小選擇上實踐「勇氣」？"}, {"theme": "節制", "thought": "真正的節制，是讓你能選擇，而不是讓衝動替你選擇。", "explain": "吃東西、購物、滑手機、工作甚至生氣，都可能變成自動反應。節制不是把生活變得無趣，而是讓你重新感覺到「我可以選」。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天在一個容易失控的習慣前，先問：我真的需要現在就做嗎？", "question": "今天，我可以在哪一個小選擇上實踐「節制」？"}, {"theme": "反省", "thought": "反省不是審判自己，而是重新校準方向。", "explain": "如果每天睡前只問「我今天哪裡做得不好」，很容易變成自責。更有用的問題是：今天什麼做得不錯？哪裡偏離了我想成為的人？明天可以微調哪一步？\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "睡前寫三句：今天值得肯定的事、需要修正的事、明天的一個小行動。", "question": "今天，我可以在哪一個小選擇上實踐「反省」？"}, {"theme": "平靜", "thought": "平靜不是世界沒有噪音，而是你不必對每個噪音都做出反應。", "explain": "生活不會因為修習斯多噶就突然變安靜。訊息仍會來、工作仍會催、別人仍可能讓你失望。真正的平靜，是你逐漸知道哪些事情值得你的反應，哪些事情可以讓它經過。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天收到一個讓你不舒服的訊息，先不要立即回覆，給自己一點距離。", "question": "今天，我可以在哪一個小選擇上實踐「平靜」？"}, {"theme": "比較", "thought": "把自己交給比較，就很難感受到自己正在擁有的生活。", "explain": "我們很容易拿自己的日常與別人的高光時刻比較。問題不只是嫉妒，而是比較會讓注意力離開自己的道路。真正值得問的不是「我比他好嗎」，而是「我今天有沒有比昨天更接近自己想成為的人？」\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "看到讓你羨慕的人時，問：我真正欣賞的是他的哪一點？", "question": "今天，我可以在哪一個小選擇上實踐「比較」？"}, {"theme": "失敗", "thought": "一次結果不好，不等於你這個人不好。", "explain": "斯多噶重視品格與行動，而不是把每一次結果都當成自我價值的判決。失敗可以提供資料：哪裡需要調整？什麼假設錯了？下一次要怎麼做？\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "把最近一次失敗寫成三件事：事實、學到的事、下一次的改變。", "question": "今天，我可以在哪一個小選擇上實踐「失敗」？"}, {"theme": "成功", "thought": "結果值得珍惜，但不要讓結果決定你的全部價值。", "explain": "成功很容易讓人想抓住它，然後開始害怕失去。更穩定的方式，是欣賞結果，同時把注意力放回帶來結果的行動、品格與習慣。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "完成一件事情後，不只問「結果好不好」，也問「我做得對不對？」", "question": "今天，我可以在哪一個小選擇上實踐「成功」？"}, {"theme": "工作", "thought": "專注做好眼前的工作，比反覆擔心最後的結果更有力量。", "explain": "我們常在工作中同時承擔「我要做好」與「別人會怎麼看我」兩種壓力。後者很多時候無法控制。把注意力拉回下一個具體動作，反而更容易把事情做好。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "把今天最重要的工作切成一個 20 分鐘的小區塊，只做第一步。", "question": "今天，我可以在哪一個小選擇上實踐「工作」？"}, {"theme": "金錢", "thought": "金錢可以是工具，但不必成為衡量人生價值的尺度。", "explain": "財富能帶來選擇與安全感，但如果內心認為「更多才代表我夠好」，終點就會不斷後退。斯多噶不是要求人拒絕物質，而是提醒我們不要把幸福完全抵押在外在條件上。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天花錢前問一次：我是因為需要、喜歡，還是想用它證明什麼？", "question": "今天，我可以在哪一個小選擇上實踐「金錢」？"}, {"theme": "孤獨", "thought": "一個人時，你仍然可以與自己的價值站在一起。", "explain": "孤獨有時讓人害怕，因為沒有外界的聲音可以暫時掩蓋內心。但安靜也提供了重新認識自己的機會。你不必永遠被陪伴，才能確定自己正在走的方向。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天留十分鐘不聽音樂、不滑手機，只讓自己安靜坐著。", "question": "今天，我可以在哪一個小選擇上實踐「孤獨」？"}, {"theme": "感恩", "thought": "感恩不是否認問題，而是同時看見仍然存在的好。", "explain": "生活可以有麻煩，也可以有值得珍惜的部分。感恩不是強迫自己樂觀，而是在注意力只盯著缺少的東西時，提醒自己重新看見已經擁有的東西。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天寫下三件普通、甚至微小，但值得感謝的事。", "question": "今天，我可以在哪一個小選擇上實踐「感恩」？"}, {"theme": "他人", "thought": "很多人讓你困擾，是因為他們正在用自己的理解活著。", "explain": "這不代表你必須接受不合理的行為，而是提醒你：別人的性格、習慣與判斷不完全由你塑造。理解這一點，可以少一點「為什麼他不照我想的做」的消耗。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "遇到難相處的人時，問：我可以設什麼界線，而不是怎麼改變他？", "question": "今天，我可以在哪一個小選擇上實踐「他人」？"}, {"theme": "失去", "thought": "有些東西之所以珍貴，正因為它們不會永遠存在。", "explain": "我們往往只有在失去時才真正注意到擁有過的東西。這個練習不是要你提前悲傷，而是讓你在還擁有的時候多一點珍惜。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天看一個你習以為常的人或物，花一分鐘認真感受它存在於你生活中的意義。", "question": "今天，我可以在哪一個小選擇上實踐「失去」？"}, {"theme": "期待", "thought": "期待越多，越容易把平靜交給外在結果。", "explain": "期待本身沒有錯，但如果我們把「事情必須照我的劇本」當成幸福的前提，就很容易被現實牽著走。可以有目標，同時為結果保留彈性。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "寫下今天一個期待，旁邊補一句：「如果結果不同，我仍然可以怎麼做？」", "question": "今天，我可以在哪一個小選擇上實踐「期待」？"}, {"theme": "界線", "thought": "接受別人不是沒有界線，溫柔也不等於無限退讓。", "explain": "斯多噶強調自己的品格與選擇，也意味著你可以清楚地說不。健康的界線不是懲罰別人，而是把自己的責任範圍說清楚。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天找一件你其實不想答應的事，練習用簡單、尊重的方式說不。", "question": "今天，我可以在哪一個小選擇上實踐「界線」？"}, {"theme": "耐心", "thought": "很多值得的事情，都需要時間才能看見結果。", "explain": "焦躁常常來自希望現在就得到未來的答案。但成長、關係、工作與習慣都需要累積。耐心不是什麼都不做，而是在持續行動時，不要求成果立刻出現。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "選一件正在累積的事情，今天只做下一個小步驟，不檢查結果。", "question": "今天，我可以在哪一個小選擇上實踐「耐心」？"}, {"theme": "簡化", "thought": "不是所有事情都值得你的注意力。", "explain": "成熟的一部分，是知道什麼可以放下。資訊、意見、社群、工作與選擇越來越多，如果每件事都要回應，注意力很快就被耗盡。簡化不是少過生活，而是更清楚地選擇。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天刪除或關閉一個不必要的通知、追蹤或資訊來源。", "question": "今天，我可以在哪一個小選擇上實踐「簡化」？"}, {"theme": "方向", "thought": "過好人生，不只是問自己想得到什麼，也要問自己想成為什麼樣的人。", "explain": "目標可以告訴你要去哪裡，但品格決定你用什麼方式抵達。當結果不完全由你控制時，仍然可以選擇誠實、勇敢、節制與善意。這些才是比較不容易被拿走的東西。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "問自己：如果今天只留下一個品格，我希望別人記得我是怎樣的人？", "question": "今天，我可以在哪一個小選擇上實踐「方向」？"}, {"theme": "重新開始", "thought": "昨天沒有做好，不代表今天不能重新選擇。", "explain": "斯多噶的練習不是要求完美，而是一次又一次把自己帶回正軌。你可能失控、拖延、說錯話，也可能做出後悔的決定；重要的是看見它、修正它，然後繼續。\n\n當你發現自己又被情緒帶走時，不必責怪自己，只要重新回來。", "practice": "今天挑一件昨天沒有做到的事，不批評自己，只重新開始。", "question": "今天，我可以在哪一個小選擇上實踐「重新開始」？"}, {"theme": "控制二分法", "thought": "把注意力放在能由你決定的部分。", "explain": "斯多噶思想最實用的一個起點，是分清楚「我能控制什麼」與「我不能控制什麼」。別人的看法、已經發生的事情、結果是否符合期待，往往不完全由你決定；但你的判斷、選擇與下一個行動，仍然在你手中。當你把力氣從不可控的地方收回來，心就會多一點空間。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天遇到一件讓你不舒服的事，寫下：我無法控制的是什麼？我現在仍能做的是什麼？", "question": "今天，我可以在哪一個小選擇上實踐「控制二分法」？"}, {"theme": "當下", "thought": "人生只能在此刻被活出來。", "explain": "我們很容易把今天交給昨天的後悔，或交給明天的擔心。可是過去不能重新操作，未來也還沒有真正發生。斯多噶不是叫人停止規劃，而是提醒我們：規劃未來之後，仍要把注意力帶回正在發生的這一刻。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天挑一件日常小事，刻意不滑手機、不分心，只做眼前這件事。", "question": "今天，我可以在哪一個小選擇上實踐「當下」？"}, {"theme": "判斷", "thought": "事情本身與我們對事情的解讀，不是同一件事。", "explain": "有人沒有回訊息是一個事實；「他一定討厭我」卻是一個推論。情緒常常不是直接由事件產生，而是被我們附加在事件上的意義放大。先把事實與故事拆開，你才有機會選擇比較穩定的回應。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "遇到情緒時，寫兩行：事實是什麼？我的解讀又是什麼？", "question": "今天，我可以在哪一個小選擇上實踐「判斷」？"}, {"theme": "逆境", "thought": "困難不一定是人生的偏離，也可以成為鍛鍊的材料。", "explain": "我們通常希望道路平坦，但真正能訓練耐心、勇氣、判斷力與韌性的，往往正是那些不順利的時刻。這不是要你喜歡痛苦，而是把已經發生的阻礙轉換成可以使用的訓練場。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天遇到阻礙時，問自己：這件事正在訓練我的哪一種能力？", "question": "今天，我可以在哪一個小選擇上實踐「逆境」？"}, {"theme": "情緒", "thought": "情緒可以被看見，但不必立刻被服從。", "explain": "憤怒、焦慮與失望都是真實的感受，但感受本身不等於命令。你可以承認「我現在很生氣」，同時決定不要讓這份生氣替你發訊息、做決定或傷害別人。中間那幾秒的停頓，就是自由。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "下一次情緒升高時，先停三秒，做一次慢呼吸，再決定要不要回應。", "question": "今天，我可以在哪一個小選擇上實踐「情緒」？"}, {"theme": "時間", "thought": "真正珍貴的，是你如何使用已經擁有的時間。", "explain": "我們常說「等有時間再做」，卻很少問自己時間究竟被什麼拿走。斯多噶提醒人正視生命有限，不是要你焦慮，而是讓你更清楚：哪些事情值得今天得到你的注意力？\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天刪掉一件不重要、卻會消耗你注意力的事情。", "question": "今天，我可以在哪一個小選擇上實踐「時間」？"}, {"theme": "死亡意識", "thought": "知道生命有限，反而能幫助我們更認真地生活。", "explain": "死亡不是一個需要每天恐懼的念頭，而是一個讓優先順序變清楚的提醒。當你知道時間不是無限供應，就比較不容易把所有力氣花在討好、比較與無止境的擔心上。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "問自己：如果我知道這一年非常珍貴，今天我還會把時間花在同樣的事情上嗎？", "question": "今天，我可以在哪一個小選擇上實踐「死亡意識」？"}, {"theme": "慾望", "thought": "自由的一部分，是不必對每一個想要立刻滿足的衝動做出反應。", "explain": "我們常以為擁有更多就會更自由，但有時候真正的自由，是可以對「我現在就想要」說一句「可以等一下」。延後滿足並不是否定享受，而是在重新取得選擇權。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天選一個小小的慾望，刻意延後十分鐘再決定。", "question": "今天，我可以在哪一個小選擇上實踐「慾望」？"}, {"theme": "名聲", "thought": "別人的評價可以存在，但不必成為你衡量自己的唯一尺度。", "explain": "我們無法控制別人如何理解自己。即使你盡力做好，也可能有人誤會你。若把自我價值交給外界，就等於把內心的方向盤交出去。更穩定的做法，是回到自己的品格與行動。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天做一件正確但不一定有人看見的事。", "question": "今天，我可以在哪一個小選擇上實踐「名聲」？"}, {"theme": "關係", "thought": "你不能控制別人的選擇，但可以控制自己如何對待別人。", "explain": "成熟並不是永遠不生氣，而是在關係裡保留界線與尊重。別人的行為不必決定你的品格。你可以不同意，可以拒絕，也可以離開，同時仍選擇不讓自己變成討厭的那種人。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天在一段關係中，先問一句「你真正想表達的是什麼？」再回應。", "question": "今天，我可以在哪一個小選擇上實踐「關係」？"}, {"theme": "自律", "thought": "小小的選擇重複久了，就會成為你的生活方式。", "explain": "自律不必等於極端。真正穩定的改變，通常來自那些小到幾乎不值得炫耀、卻願意每天重複的行動。與其期待某天突然變得很有意志力，不如把今天的門檻降低到可以完成。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "選一件十分鐘內能完成的好習慣，今天先做一次。", "question": "今天，我可以在哪一個小選擇上實踐「自律」？"}, {"theme": "接受", "thought": "接受已發生的事，不等於喜歡它。", "explain": "接受的意思不是說「這很好」，而是停止與已經發生的事爭辯。事情既然已經發生，否認它只會再消耗一次力氣。接受現實之後，你才能把剩下的力量用在下一步。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "寫下「已經發生的事」，再寫下「我現在能做的一步」。", "question": "今天，我可以在哪一個小選擇上實踐「接受」？"}, {"theme": "勇氣", "thought": "勇氣不是沒有害怕，而是害怕仍然知道什麼值得去做。", "explain": "如果一定要等到完全不害怕才行動，我們很可能永遠不會開始。勇氣比較像是一種選擇：我知道這件事讓我不舒服，但它仍然值得我面對。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天做一件你一直逃避、但其實知道應該面對的小事。", "question": "今天，我可以在哪一個小選擇上實踐「勇氣」？"}, {"theme": "節制", "thought": "真正的節制，是讓你能選擇，而不是讓衝動替你選擇。", "explain": "吃東西、購物、滑手機、工作甚至生氣，都可能變成自動反應。節制不是把生活變得無趣，而是讓你重新感覺到「我可以選」。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天在一個容易失控的習慣前，先問： : "今天，我可以在哪一個小選擇上實踐「孤獨」？"}, {"theme": "感恩", "thought": "感恩不是否認問題，而是同時看見仍然存在的好。", "explain": "生活可以有麻煩，也可以有值得珍惜的部分。感恩不是強迫自己樂觀，而是在注意力只盯著缺少的東西時，提醒自己重新看見已經擁有的東西。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天寫下三件普通、甚至微小，但值得感謝的事。", "question": "今天，我可以在哪一個小選擇上實踐「感恩」？"}, {"theme": "他人", "thought": "很多人讓你困擾，是因為他們正在用自己的理解活著。", "explain": "這不代表你必須接受不合理的行為，而是提醒你：別人的性格、習慣與判斷不完全由你塑造。理解這一點，可以少一點「為什麼他不照我想的做」的消耗。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "遇到難相處的人時，問：我可以設什麼界線，而不是怎麼改變他？", "question": "今天，我可以在哪一個小選擇上實踐「他人」？"}, {"theme": "失去", "thought": "有些東西之所以珍貴，正因為它們不會永遠存在。", "explain": "我們往往只有在失去時才真正注意到擁有過的東西。這個練習不是要你提前悲傷，而是讓你在還擁有的時候多一點珍惜。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天看一個你習以為常的人或物，花一分鐘認真感受它存在於你生活中的意義。", "question": "今天，我可以在哪一個小選擇上實踐「失去」？"}, {"theme": "期待", "thought": "期待越多，越容易把平靜交給外在結果。", "explain": "期待本身沒有錯，但如果我們把「事情必須照我的劇本」當成幸福的前提，就很容易被現實牽著走。可以有目標，同時為結果保留彈性。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "寫下今天一個期待，旁邊補一句：「如果結果不同，我仍然可以怎麼做？」", "question": "今天，我可以在哪一個小選擇上實踐「期待」？"}, {"theme": "界線", "thought": "接受別人不是沒有界線，溫柔也不等於無限退讓。", "explain": "斯多噶強調自己的品格與選擇，也意味著你可以清楚地說不。健康的界線不是懲罰別人，而是把自己的責任範圍說清楚。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天找一件你其實不想答應的事，練習用簡單、尊重的方式說不。", "question": "今天，我可以在哪一個小選擇上實踐「界線」？"}, {"theme": "耐心", "thought": "很多值得的事情，都需要時間才能看見結果。", "explain": "焦躁常常來自希望現在就得到未來的答案。但成長、關係、工作與習慣都需要累積。耐心不是什麼都不做，而是在持續行動時，不要求成果立刻出現。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "選一件正在累積的事情，今天只做下一個小步驟，不檢查結果。", "question": "今天，我可以在哪一個小選擇上實踐「耐心」？"}, {"theme": "簡化", "thought": "不是所有事情都值得你的注意力。", "explain": "成熟的一部分，是知道什麼可以放下。資訊、意見、社群、工作與選擇越來越多，如果每件事都要回應，注意力很快就被耗盡。簡化不是少過生活，而是更清楚地選擇。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "今天刪除或關閉一個不必要的通知、追蹤或資訊來源。", "question": "今天，我可以在哪一個小選擇上實踐「簡化」？"}, {"theme": "方向", "thought": "過好人生，不只是問自己想得到什麼，也要問自己想成為什麼樣的人。", "explain": "目標可以告訴你要去哪裡，但品格決定你用什麼方式抵達。當結果不完全由你控制時，仍然可以選擇誠實、勇敢、節制與善意。這些才是比較不容易被拿走的東西。\n\n今天把問題縮小一點，你通常會更容易看見下一步。", "practice": "問自己：如果今天只留下一個品格，我希望別人記得我是怎樣的人？", "question": "今天，我可以在哪一個小選擇上實踐「方向」？"}, {"theme": "重新開始", "thought": "昨天沒有做好，不代表今天不 ", "thought": "別人的評價可以存在，但不必成為你衡量自己的唯一尺度。", "explain": "我們無法控制別人如何理解自己。即使你盡力做好，也可能有人誤會你。若把自我價值交給外界，就等於把內心的方向盤交出去。更穩定的做法，是回到自己的品格與行動。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "今天做一件正確但不一定有人看見的事。", "question": "今天，我可以在哪一個小選擇上實踐「名聲」？"}, {"theme": "關係", "thought": "你不能控制別人的選擇，但可以控制自己如何對待別人。", "explain": "成熟並不是永遠不生氣，而是在關係裡保留界線與尊重。別人的行為不必決定你的品格。你可以不同意，可以拒絕，也可以離開，同時仍選擇不讓自己變成討厭的那種人。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "今天在一段關係中，先問一句「你真正想表達的是什麼？」再回應。", "question": "今天，我可以在哪一個小選擇上實踐「關係」？"}, {"theme": "自律", "thought": "小小的選擇重複久了，就會成為你的生活方式。", "explain": "自律不必等於極端。真正穩定的改變，通常來自那些小到幾乎不值得炫耀、卻願意每天重複的行動。與其期待某天突然變得很有意志力，不如把今天的門檻降低到可以完成。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "選一件十分鐘內能完成的好習慣，今天先做一次。", "question": "今天，我可以在哪一個小選擇上實踐「自律」？"}, {"theme": "接受", "thought": "接受已發生的事，不等於喜歡它。", "explain": "接受的意思不是說「這很好」，而是停止與已經發生的事爭辯。事情既然已經發生，否認它只會再消耗一次力氣。接受現實之後，你才能把剩下的力量用在下一步。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "寫下「已經發生的事」，再寫下「我現在能做的一步」。", "question": "今天，我可以在哪一個小選擇上實踐「接受」？"}, {"theme": "勇氣", "thought": "勇氣不是沒有害怕，而是害怕仍然知道什麼值得去做。", "explain": "如果一定要等到完全不害怕才行動，我們很可能永遠不會開始。勇氣比較像是一種選擇：我知道這件事讓我不舒服，但它仍然值得我面對。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "今天做一件你一直逃避、但其實知道應該面對的小事。", "question": "今天，我可以在哪一個小選擇上實踐「勇氣」？"}, {"theme": "節制", "thought": "真正的節制，是讓你能選擇，而不是讓衝動替你選擇。", "explain": "吃東西、購物、滑手機、工作甚至生氣，都可能變成自動反應。節制不是把生活變得無趣，而是讓你重新感覺到「我可以選」。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "今天在一個容易失控的習慣前，先問：我真的需要現在就做嗎？", "question": "今天，我可以在哪一個小選擇上實踐「節制」？"}, {"theme": "反省", "thought": "反省不是審判自己，而是重新校準方向。", "explain": "如果每天睡前只問「我今天哪裡做得不好」，很容易變成自責。更有用的問題是：今天什麼做得不錯？哪裡偏離了我想成為的人？明天可以微調哪一步？\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "睡前寫三句：今天值得肯定的事、需要修正的事、明天的一個小行動。", "question": "今天，我可以在哪一個小選擇上實踐「反省」？"}, {"theme": "平靜", "thought": "平靜不是世界沒有噪音，而是你不必對每個噪音都做出反應。", "explain": "生活不會因為修習斯多噶就突然變安靜。訊息仍會來、工作仍會催、別人仍可能讓你失望。真正的平靜，是你逐漸知道哪些事情值得你的反應，哪些事情可以讓它經過。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "今天收到一個讓你不舒服的訊息，先不要立即回覆，給自己一點距離。", "question": "今天，我可以在哪一個小選擇上實踐「平靜」？"}, {"theme": "比較", "thought": "把自己交給比較，就很難感受到自己正在擁有的生活。", "explain": "我們很容易拿自己的日常與別人的高光時刻比較。問題不只是嫉妒，而是比較會讓注意力離開自己的道路。真正值得問的不是「我比他好嗎」，而是「我今天有沒有比昨天更接近自己想成為的人？」\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "看到讓你羨慕的人時，問：我真正欣賞的是他的哪一點？", "question": "今天，我可以在哪一個小選擇上實踐「比較」？"}, {"theme": "失敗", "thought": "一次結果不好，不等於你這個人不好。", "explain": "斯多噶重視品格與行動，而不是把每一次結果都當成自我價值的判決。失敗可以提供資料：哪裡需要調整？什麼假設錯了？下一次要怎麼做？\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "把最近一次失敗寫成三件事：事實、學到的事、下一次的改變。", "question": "今天，我可以在哪一個小選擇上實踐「失敗」？"}, {"theme": "成功", "thought": "結果值得珍惜，但不要讓結果決定你的全部價值。", "explain": "成功很容易讓人想抓住它，然後開始害怕失去。更穩定的方式，是欣賞結果，同時把注意力放回帶來結果的行動、品格與習慣。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "完成一件事情後，不只問「結果好不好」，也問「我做得對不對？」", "question": "今天，我可以在哪一個小選擇上實踐「成功」？"}, {"theme": "工作", "thought": "專注做好眼前的工作，比反覆擔心最後的結果更有力量。", "explain": "我們常在工作中同時承擔「我要做好」與「別人會怎麼看我」兩種壓力。後者很多時候無法控制。把注意力拉回下一個具體動作，反而更容易把事情做好。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "把今天最重要的工作切成一個 20 分鐘的小區塊，只做第一步。", "question": "今天，我可以在哪一個小選擇上實踐「工作」？"}, {"theme": "金錢", "thought": "金錢可以是工具，但不必成為衡量人生價值的尺度。", "explain": "財富能帶來選擇與安全感，但如果內心認為「更多才代表我夠好」，終點就會不斷後退。斯多噶不是要求人拒絕物質，而是提醒我們不要把幸福完全抵押在外在條件上。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "今天花錢前問一次：我是因為需要、喜歡，還是想用它證明什麼？", "question": "今天，我可以在哪一個小選擇上實踐「金錢」？"}, {"theme": "孤獨", "thought": "一個人時，你仍然可以與自己的價值站在一起。", "explain": "孤獨有時讓人害怕，因為沒有外界的聲音可以暫時掩蓋內心。但安靜也提供了重新認識自己的機會。你不必永遠被陪伴，才能確定自己正在走的方向。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "今天留十分鐘不聽音樂、不滑手機，只讓自己安靜坐著。", "question": "今天，我可以在哪一個小選擇上實踐「孤獨」？"}, {"theme": "感恩", "thought": "感恩不是否認問題，而是同時看見仍然存在的好。", "explain": "生活可以有麻煩，也可以有值得珍惜的部分。感恩不是強迫自己樂觀，而是在注意力只盯著缺少的東西時，提醒自己重新看見已經擁有的東西。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "今天寫下三件普通、甚至微小，但值得感謝的事。", "question": "今天，我可以在哪一個小選擇上實踐「感恩」？"}, {"theme": "他人", "thought": "很多人讓你困擾，是因為他們正在用自己的理解活著。", "explain": "這不代表你必須接受不合理的行為，而是提醒你：別人的性格、習慣與判斷不完全由你塑造。理解這一點，可以少一點「為什麼他不照我想的做」的消耗。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "遇到難相處的人時，問：我可以設什麼界線，而不是怎麼改變他？", "question": "今天，我可以在哪一個小選擇上實踐「他人」？"}, {"theme": "失去", "thought": "有些東西之所以珍貴，正因為它們不會永遠存在。", "explain": "我們往往只有在失去時才真正注意到擁有過的東西。這個練習不是要你提前悲傷，而是讓你在還擁有的時候多一點珍惜。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "今天看一個你習以為常的人或物，花一分鐘認真感受它存在於你生活中的意義。", "question": "今天，我可以在哪一個小選擇上實踐「失去」？"}, {"theme": "期待", "thought": "期待越多，越容易把平靜交給外在結果。", "explain": "期待本身沒有錯，但如果我們把「事情必須照我的劇本」當成幸福的前提，就很容易被現實牽著走。可以有目標，同時為結果保留彈性。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "寫下今天一個期待，旁邊補一句：「如果結果不同，我仍然可以怎麼做？」", "question": "今天，我可以在哪一個小選擇上實踐「期待」？"}, {"theme": "界線", "thought": "接受別人不是沒有界線，溫柔也不等於無限退讓。", "explain": "斯多噶強調自己的品格與選擇，也意味著你可以清楚地說不。健康的界線不是懲罰別人，而是把自己的責任範圍說清楚。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "今天找一件你其實不想答應的事，練習用簡單、尊重的方式說不。", "question": "今天，我可以在哪一個小選擇上實踐「界線」？"}, {"theme": "耐心", "thought": "很多值得的事情，都需要時間才能看見結果。", "explain": "焦躁常常來自希望現在就得到未來的答案。但成長、關係、工作與習慣都需要累積。耐心不是什麼都不做，而是在持續行動時，不要求成果立刻出現。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "選一件正在累積的事情，今天只做下一個小步驟，不檢查結果。", "question": "今天，我可以在哪一個小選擇上實踐「耐心」？"}, {"theme": "簡化", "thought": "不是所有事情都值得你的注意力。", "explain": "成熟的一部分，是知道什麼可以放下。資訊、意見、社群、工作與選擇越來越多，如果每件事都要回應，注意力很快就被耗盡。簡化不是少過生活，而是更清楚地選擇。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "今天刪除或關閉一個不必要的通知、追蹤或資訊來源。", "question": "今天，我可以在哪一個小選擇上實踐「簡化」？"}, {"theme": "方向", "thought": "過好人生，不只是問自己想得到什麼，也要問自己想成為什麼樣的人。", "explain": "目標可以告訴你要去哪裡，但品格決定你用什麼方式抵達。當結果不完全由你控制時，仍然可以選擇誠實、勇敢、節制與善意。這些才是比較不容易被拿走的東西。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "問自己：如果今天只留下一個品格，我希望別人記得我是怎樣的人？", "question": "今天，我可以在哪一個小選擇上實踐「方向」？"}, {"theme": "重新開始", "thought": "昨天沒有做好，不代表今天不能重新選擇。", "explain": "斯多噶的練習不是要求完美，而是一次又一次把自己帶回正軌。你可能失控、拖延、說錯話，也可能做出後悔的決定；重要的是看見它、修正它，然後繼續。\n\n讀懂一個道理不等於活出它；今天用一個行動把它變成自己的經驗。", "practice": "今天挑一件昨天沒有做到的事，不批評自己，只重新開始。", "question": "今天，我可以在哪一個小選擇上實踐「重新開始」？"}, {"theme": "控制二分法", "thought": "把注意力放在能由你決定的部分。", "explain": "斯多噶思想最實用的一個起點，是分清楚「我能控制什麼」與「我不能控制什麼」。別人的看法、已經發生的事情、結果是否符合期待，往往不完全由你決定；但你的判斷、選擇與下一個行動，仍然在你手中。當你把力氣從不可控的地方收回來，心就會多一點空間。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天遇到一件讓你不舒服的事，寫下：我無法控制的是什麼？我現在仍能做的是什麼？", "question": "今天，我可以在哪一個小選擇上實踐「控制二分法」？"}, {"theme": "當下", "thought": "人生只能在此刻被活出來。", "explain": "我們很容易把今天交給昨天的後悔，或交給明天的擔心。可是過去不能重新操作，未來也還沒有真正發生。斯多噶不是叫人停止規劃，而是提醒我們：規劃未來之後，仍要把注意力帶回正在發生的這一刻。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天挑一件日常小事，刻意不滑手機、不分心，只做眼前這件事。", "question": "今天，我可以在哪一個小選擇上實踐「當下」？"}, {"theme": "判斷", "thought": "事情本身與我們對事情的解讀，不是同一件事。", "explain": "有人沒有回訊息是一個事實；「他一定討厭我」卻是一個推論。情緒常常不是直接由事件產生，而是被我們附加在事件上的意義放大。先把事實與故事拆開，你才有機會選擇比較穩定的回應。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "遇到情緒時，寫兩行：事實是什麼？我的解讀又是什麼？", "question": "今天，我可以在哪一個小選擇上實踐「判斷」？"}, {"theme": "逆境", "thought": "困難不一定是人生的偏離，也可以成為鍛鍊的材料。", "explain": "我們通常希望道路平坦，但真正能訓練耐心、勇氣、判斷力與韌性的，往往正是那些不順利的時刻。這不是要你喜歡痛苦，而是把已經發生的阻礙轉換成可以使用的訓練場。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天遇到阻礙時，問自己：這件事正在訓練我的哪一種能力？", "question": "今天，我可以在哪一個小選擇上實踐「逆境」？"}, {"theme": "情緒", "thought": "情緒可以被看見，但不必立刻被服從。", "explain": "憤怒、焦慮與失望都是真實的感受，但感受本身不等於命令。你可以承認「我現在很生氣」，同時決定不要讓這份生氣替你發訊息、做決定或傷害別人。中間那幾秒的停頓，就是自由。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "下一次情緒升高時，先停三秒，做一次慢呼吸，再決定要不要回應。", "question": "今天，我可以在哪一個小選擇上實踐「情緒」？"}, {"theme": "時間", "thought": "真正珍貴的，是你如何使用已經擁有的時間。", "explain": "我們常說「等有時間再做」，卻很少問自己時間究竟被什麼拿走。斯多噶提醒人正視生命有限，不是要你焦慮，而是讓你更清楚：哪些事情值得今天得到你的注意力？\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天刪掉一件不重要、卻會消耗你注意力的事情。", "question": "今天，我可以在哪一個小選擇上實踐「時間」？"}, {"theme": "死亡意識", "thought": "知道生命有限，反而能幫助我們更認真地生活。", "explain": "死亡不是一個需要每天恐懼的念頭，而是一個讓優先順序變清楚的提醒。當你知道時間不是無限供應，就比較不容易把所有力氣花在討好、比較與無止境的擔心上。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "問自己：如果我知道這一年非常珍貴，今天我還會把時間花在同樣的事情上嗎？", "question": "今天，我可以在哪一個小選擇上實踐「死亡意識」？"}, {"theme": "慾望", "thought": "自由的一部分，是不必對每一個想要立刻滿足的衝動做出反應。", "explain": "我們常以為擁有更多就會更自由，但有時候真正的自由，是可以對「我現在就想要」說一句「可以等一下」。延後滿足並不是否定享受，而是在重新取得選擇權。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天選一個小小的慾望，刻意延後十分鐘再決定。", "question": "今天，我可以在哪一個小選擇上實踐「慾望」？"}, {"theme": "名聲", "thought": "別人的評價可以存在，但不必成為你衡量自己的唯一尺度。", "explain": "我們無法控制別人如何理解自己。即使你盡力做好，也可能有人誤會你。若把自我價值交給外界，就等於把內心的方向盤交出去。更穩定的做法，是回到自己的品格與行動。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天做一件正確但不一定有人看見的事。", "question": "今天，我可以在哪一個小選擇上實踐「名聲」？"}, {"theme": "關係", "thought": "你不能控制別人的選擇，但可以控制自己如何對待別人。", "explain": "成熟並不是永遠不生氣，而是在關係裡保留界線與尊重。別人的行為不必決定你的品格。你可以不同意，可以拒絕，也可以離開，同時仍選擇不讓自己變成討厭的那種人。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天在一段關係中，先問一句「你真正想表達的是什麼？」再回應。", "question": "今天，我可以在哪一個小選擇上實踐「關係」？"}, {"theme": "自律", "thought": "小小的選擇重複久了，就會成為你的生活方式。", "explain": "自律不必等於極端。真正穩定的改變，通常來自那些小到幾乎不值得炫耀、卻願意每天重複的行動。與其期待某天突然變得很有意志力，不如把今天的門檻降低到可以完成。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "選一件十分鐘內能完成的好習慣，今天先做一次。", "question": "今天，我可以在哪一個小選擇上實踐「自律」？"}, {"theme": "接受", "thought": "接受已發生的事，不等於喜歡它。", "explain": "接受的意思不是說「這很好」，而是停止與已經發生的事爭辯。事情既然已經發生，否認它只會再消耗一次力氣。接受現實之後，你才能把剩下的力量用在下一步。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "寫下「已經發生的事」，再寫下「我現在能做的一步」。", "question": "今天，我可以在哪一個小選擇上實踐「接受」？"}, {"theme": "勇氣", "thought": "勇氣不是沒有害怕，而是害怕仍然知道什麼值得去做。", "explain": "如果一定要等到完全不害怕才行動，我們很可能永遠不會開始。勇氣比較像是一種選擇：我知道這件事讓我不舒服，但它仍然值得我面對。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天做一件你一直逃避、但其實知道應該面對的小事。", "question": "今天，我可以在哪一個小選擇上實踐「勇氣」？"}, {"theme": "節制", "thought": "真正的節制，是讓你能選擇，而不是讓衝動替你選擇。", "explain": "吃東西、購物、滑手機、工作甚至生氣，都可能變成自動反應。節制不是把生活變得無趣，而是讓你重新感覺到「我可以選」。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天在一個容易失控的習慣前，先問：我真的需要現在就做嗎？", "question": "今天，我可以在哪一個小選擇上實踐「節制」？"}, {"theme": "反省", "thought": "反省不是審判自己，而是重新校準方向。", "explain": "如果每天睡前只問「我今天哪裡做得不好」，很容易變成自責。更有用的問題是：今天什麼做得不錯？哪裡偏離了我想成為的人？明天可以微調哪一步？\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "睡前寫三句：今天值得肯定的事、需要修正的事、明天的一個小行動。", "question": "今天，我可以在哪一個小選擇上實踐「反省」？"}, {"theme": "平靜", "thought": "平靜不是世界沒有噪音，而是你不必對每個噪音都做出反應。", "explain": "生活不會因為修習斯多噶就突然變安靜。訊息仍會來、工作仍會催、別人仍可能讓你失望。真正的平靜，是你逐漸知道哪些事情值得你的反應，哪些事情可以讓它經過。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天收到一個讓你不舒服的訊息，先不要立即回覆，給自己一點距離。", "question": "今天，我可以在哪一個小選擇上實踐「平靜」？"}, {"theme": "比較", "thought": "把自己交給比較，就很難感受到自己正在擁有的生活。", "explain": "我們很容易拿自己的日常與別人的高光時刻比較。問題不只是嫉妒，而是比較會讓注意力離開自己的道路。真正值得問的不是「我比他好嗎」，而是「我今天有沒有比昨天更接近自己想成為的人？」\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "看到讓你羨慕的人時，問：我真正欣賞的是他的哪一點？", "question": "今天，我可以在哪一個小選擇上實踐「比較」？"}, {"theme": "失敗", "thought": "一次結果不好，不等於你這個人不好。", "explain": "斯多噶重視品格與行動，而不是把每一次結果都當成自我價值的判決。失敗可以提供資料：哪裡需要調整？什麼假設錯了？下一次要怎麼做？\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "把最近一次失敗寫成三件事：事實、學到的事、下一次的改變。", "question": "今天，我可以在哪一個小選擇上實踐「失敗」？"}, {"theme": "成功", "thought": "結果值得珍惜，但不要讓結果決定你的全部價值。", "explain": "成功很容易讓人想抓住它，然後開始害怕失去。更穩定的方式，是欣賞結果，同時把注意力放回帶來結果的行動、品格與習慣。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "完成一件事情後，不只問「結果好不好」，也問「我做得對不對？」", "question": "今天，我可以在哪一個小選擇上實踐「成功」？"}, {"theme": "工作", "thought": "專注做好眼前的工作，比反覆擔心最後的結果更有力量。", "explain": "我們常在工作中同時承擔「我要做好」與「別人會怎麼看我」兩種壓力。後者很多時候無法控制。把注意力拉回下一個具體動作，反而更容易把事情做好。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "把今天最重要的工作切成一個 20 分鐘的小區塊，只做第一步。", "question": "今天，我可以在哪一個小選擇上實踐「工作」？"}, {"theme": "金錢", "thought": "金錢可以是工具，但不必成為衡量人生價值的尺度。", "explain": "財富能帶來選擇與安全感，但如果內心認為「更多才代表我夠好」，終點就會不斷後退。斯多噶不是要求人拒絕物質，而是提醒我們不要把幸福完全抵押在外在條件上。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天花錢前問一次：我是因為需要、喜歡，還是想用它證明什麼？", "question": "今天，我可以在哪一個小選擇上實踐「金錢」？"}, {"theme": "孤獨", "thought": "一個人時，你仍然可以與自己的價值站在一起。", "explain": "孤獨有時讓人害怕，因為沒有外界的聲音可以暫時掩蓋內心。但安靜也提供了重新認識自己的機會。你不必永遠被陪伴，才能確定自己正在走的方向。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天留十分鐘不聽音樂、不滑手機，只讓自己安靜坐著。", "question": "今天，我可以在哪一個小選擇上實踐「孤獨」？"}, {"theme": "感恩", "thought": "感恩不是否認問題，而是同時看見仍然存在的好。", "explain": "生活可以有麻煩，也可以有值得珍惜的部分。感恩不是強迫自己樂觀，而是在注意力只盯著缺少的東西時，提醒自己重新看見已經擁有的東西。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天寫下三件普通、甚至微小，但值得感謝的事。", "question": "今天，我可以在哪一個小選擇上實踐「感恩」？"}, {"theme": "他人", "thought": "很多人讓你困擾，是因為他們正在用自己的理解活著。", "explain": "這不代表你必須接受不合理的行為，而是提醒你：別人的性格、習慣與判斷不完全由你塑造。理解這一點，可以少一點「為什麼他不照我想的做」的消耗。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "遇到難相處的人時，問：我可以設什麼界線，而不是怎麼改變他？", "question": "今天，我可以在哪一個小選擇上實踐「他人」？"}, {"theme": "失去", "thought": "有些東西之所以珍貴，正因為它們不會永遠存在。", "explain": "我們往往只有在失去時才真正注意到擁有過的東西。這個練習不是要你提前悲傷，而是讓你在還擁有的時候多一點珍惜。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天看一個你習以為常的人或物，花一分鐘認真感受它存在於你生活中的意義。", "question": "今天，我可以在哪一個小選擇上實踐「失去」？"}, {"theme": "期待", "thought": "期待越多，越容易把平靜交給外在結果。", "explain": "期待本身沒有錯，但如果我們把「事情必須照我的劇本」當成幸福的前提，就很容易被現實牽著走。可以有目標，同時為結果保留彈性。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "寫下今天一個期待，旁邊補一句：「如果結果不同，我仍然可以怎麼做？」", "question": "今天，我可以在哪一個小選擇上實踐「期待」？"}, {"theme": "界線", "thought": "接受別人不是沒有界線，溫柔也不等於無限退讓。", "explain": "斯多噶強調自己的品格與選擇，也意味著你可以清楚地說不。健康的界線不是懲罰別人，而是把自己的責任範圍說清楚。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天找一件你其實不想答應的事，練習用簡單、尊重的方式說不。", "question": "今天，我可以在哪一個小選擇上實踐「界線」？"}, {"theme": "耐心", "thought": "很多值得的事情，都需要時間才能看見結果。", "explain": "焦躁常常來自希望現在就得到未來的答案。但成長、關係、工作與習慣都需要累積。耐心不是什麼都不做，而是在持續行動時，不要求成果立刻出現。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "選一件正在累積的事情，今天只做下一個小步驟，不檢查結果。", "question": "今天，我可以在哪一個小選擇上實踐「耐心」？"}, {"theme": "簡化", "thought": "不是所有事情都值得你的注意力。", "explain": "成熟的一部分，是知道什麼可以放下。資訊、意見、社群、工作與選擇越來越多，如果每件事都要回應，注意力很快就被耗盡。簡化不是少過生活，而是更清楚地選擇。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天刪除或關閉一個不必要的通知、追蹤或資訊來源。", "question": "今天，我可以在哪一個小選擇上實踐「簡化」？"}, {"theme": "方向", "thought": "過好人生，不只是問自己想得到什麼，也要問自己想成為什麼樣的人。", "explain": "目標可以告訴你要去哪裡，但品格決定你用什麼方式抵達。當結果不完全由你控制時，仍然可以選擇誠實、勇敢、節制與善意。這些才是比較不容易被拿走的東西。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "問自己：如果今天只留下一個品格，我希望別人記得我是怎樣的人？", "question": "今天，我可以在哪一個小選擇上實踐「方向」？"}, {"theme": "重新開始", "thought": "昨天沒有做好，不代表今天不能重新選擇。", "explain": "斯多噶的練習不是要求完美，而是一次又一次把自己帶回正軌。你可能失控、拖延、說錯話，也可能做出後悔的決定；重要的是看見它、修正它，然後繼續。\n\n有些事情只能等待，有些事情可以現在開始；把兩者分清楚。", "practice": "今天挑一件昨天沒有做到的事，不批評自己，只重新開始。", "question": "今天，我可以在哪一個小選擇上實踐「重新開始」？"}, {"theme": "控制二分法", "thought": "把注意力放在能由你決定的部分。", "explain": "斯多噶思想最實用的一個起點，是分清楚「我能控制什麼」與「我不能控制什麼」。別人的看法、已經發生的事情、結果是否符合期待，往往不完全由你決定；但你的判斷、選擇與下一個行動，仍然在你手中。當你把力氣從不可控的地方收回來，心就會多一點空間。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "今天遇到一件讓你不舒服的事，寫下：我無法控制的是什麼？我現在仍能做的是什麼？", "question": "今天，我可以在哪一個小選擇上實踐「控制二分法」？"}, {"theme": "當下", "thought": "人生只能在此刻被活出來。", "explain": "我們很容易把今天交給昨天的後悔，或交給明天的擔心。可是過去不能重新操作，未來也還沒有真正發生。斯多噶不是叫人停止規劃，而是提醒我們：規劃未來之後，仍要把注意力帶回正在發生的這一刻。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "今天挑一件日常小事，刻意不滑手機、不分心，只做眼前這件事。", "question": "今天，我可以在哪一個小選擇上實踐「當下」？"}, {"theme": "判斷", "thought": "事情本身與我們對事情的解讀，不是同一件事。", "explain": "有人沒有回訊息是一個事實；「他一定討厭我」卻是一個推論。情緒常常不是直接由事件產生，而是被我們附加在事件上的意義放大。先把事實與故事拆開，你才有機會選擇比較穩定的回應。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "遇到情緒時，寫兩行：事實是什麼？我的解讀又是什麼？", "question": "今天，我可以在哪一個小選擇上實踐「判斷」？"}, {"theme": "逆境", "thought": "困難不一定是人生的偏離，也可以成為鍛鍊的材料。", "explain": "我們通常希望道路平坦，但真正能訓練耐心、勇氣、判斷力與韌性的，往往正是那些不順利的時刻。這不是要你喜歡痛苦，而是把已經發生的阻礙轉換成可以使用的訓練場。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "今天遇到阻礙時，問自己：這件事正在訓練我的哪一種能力？", "question": "今天，我可以在哪一個小選擇上實踐「逆境」？"}, {"theme": "情緒", "thought": "情緒可以被看見，但不必立刻被服從。", "explain": "憤怒、焦慮與失望都是真實的感受，但感受本身不等於命令。你可以承認「我現在很生氣」，同時決定不要讓這份生氣替你發訊息、做決定或傷害別人。中間那幾秒的停頓，就是自由。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "下一次情緒升高時，先停三秒，做一次慢呼吸，再決定要不要回應。", "question": "今天，我可以在哪一個小選擇上實踐「情緒」？"}, {"theme": "時間", "thought": "真正珍貴的，是你如何使用已經擁有的時間。", "explain": "我們常說「等有時間再做」，卻很少問自己時間究竟被什麼拿走。斯多噶提醒人正視生命有限，不是要你焦慮，而是讓你更清楚：哪些事情值得今天得到你的注意力？\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "今天刪掉一件不重要、卻會消耗你注意力的事情。", "question": "今天，我可以在哪一個小選擇上實踐「時間」？"}, {"theme": "死亡意識", "thought": "知道生命有限，反而能幫助我們更認真地生活。", "explain": "死亡不是一個需要每天恐懼的念頭，而是一個讓優先順序變清楚的提醒。當你知道時間不是無限供應，就比較不容易把所有力氣花在討好、比較與無止境的擔心上。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "問自己：如果我知道這一年非常珍貴，今天我還會把時間花在同樣的事情上嗎？", "question": "今天，我可以在哪一個小選擇上實踐「死亡意識」？"}, {"theme": "慾望", "thought": "自由的一部分，是不必對每一個想要立刻滿足的衝動做出反應。", "explain": "我們常以為擁有更多就會更自由，但有時候真正的自由，是可以對「我現在就想要」說一句「可以等一下」。延後滿足並不是否定享受，而是在重新取得選擇權。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "今天選一個小小的慾望，刻意延後十分鐘再決定。", "question": "今天，我可以在哪一個小選擇上實踐「慾望」？"}, {"theme": "名聲", "thought": "別人的評價可以存在，但不必成為你衡量自己的唯一尺度。", "explain": "我們無法控制別人如何理解自己。即使你盡力做好，也可能有人誤會你。若把自我價值交給外界，就等於把內心的方向盤交出去。更穩定的做法，是回到自己的品格與行動。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "今天做一件正確但不一定有人看見的事。", "question": "今天，我可以在哪一個小選擇上實踐「名聲」？"}, {"theme": "關係", "thought": "你不能控制別人的選擇，但可以控制自己如何對待別人。", "explain": "成熟並不是永遠不生氣，而是在關係裡保留界線與尊重。別人的行為不必決定你的品格。你可以不同意，可以拒絕，也可以離開，同時仍選擇不讓自己變成討厭的那種人。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "今天在一段關係中，先問一句「你真正想表達的是什麼？」再回應。", "question": "今天，我可以在哪一個小選擇上實踐「關係」？"}, {"theme": "自律", "thought": "小小的選擇重複久了，就會成為你的生活方式。", "explain": "自律不必等於極端。真正穩定的改變，通常來自那些小到幾乎不值得炫耀、卻願意每天重複的行動。與其期待某天突然變得很有意志力，不如把今天的門檻降低到可以完成。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "選一件十分鐘內能完成的好習慣，今天先做一次。", "question": "今天，我可以在哪一個小選擇上實踐「自律」？"}, {"theme": "接受", "thought": "接受已發生的事，不等於喜歡它。", "explain": "接受的意思不是說「這很好」，而是停止與已經發生的事爭辯。事情既然已經發生，否認它只會再消耗一次力氣。接受現實之後，你才能把剩下的力量用在下一步。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "寫下「已經發生的事」，再寫下「我現在能做的一步」。", "question": "今天，我可以在哪一個小選擇上實踐「接受」？"}, {"theme": "勇氣", "thought": "勇氣不是沒有害怕，而是害怕仍然知道什麼值得去做。", "explain": "如果一定要等到完全不害怕才行動，我們很可能永遠不會開始。勇氣比較像是一種選擇：我知道這件事讓我不舒服，但它仍然值得我面對。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "今天做一件你一直逃避、但其實知道應該面對的小事。", "question": "今天，我可以在哪一個小選擇上實踐「勇氣」？"}, {"theme": "節制", "thought": "真正的節制，是讓你能選擇，而不是讓衝動替你選擇。", "explain": "吃東西、購物、滑手機、工作甚至生氣，都可能變成自動反應。節制不是把生活變得無趣，而是讓你重新感覺到「我可以選」。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "今天在一個容易失控的習慣前，先問：我真的需要現在就做嗎？", "question": "今天，我可以在哪一個小選擇上實踐「節制」？"}, {"theme": "反省", "thought": "反省不是審判自己，而是重新校準方向。", "explain": "如果每天睡前只問「我今天哪裡做得不好」，很容易變成自責。更有用的問題是：今天什麼做得不錯？哪裡偏離了我想成為的人？明天可以微調哪一步？\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "睡前寫三句：今天值得肯定的事、需要修正的事、明天的一個小行動。", "question": "今天，我可以在哪一個小選擇上實踐「反省」？"}, {"theme": "平靜", "thought": "平靜不是世界沒有噪音，而是你不必對每個噪音都做出反應。", "explain": "生活不會因為修習斯多噶就突然變安靜。訊息仍會來、工作仍會催、別人仍可能讓你失望。真正的平靜，是你逐漸知道哪些事情值得你的反應，哪些事情可以讓它經過。\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "今天收到一個讓你不舒服的訊息，先不要立即回覆，給自己一點距離。", "question": "今天，我可以在哪一個小選擇上實踐「平靜」？"}, {"theme": "比較", "thought": "把自己交給比較，就很難感受到自己正在擁有的生活。", "explain": "我們很容易拿自己的日常與別人的高光時刻比較。問題不只是嫉妒，而是比較會讓注意力離開自己的道路。真正值得問的不是「我比他好嗎」，而是「我今天有沒有比昨天更接近自己想成為的人？」\n\n今晚回頭看時，不問自己是否完美，只問是否更接近想成為的人。", "practice": "看到讓你羨慕的人時，問：我真正欣賞的是他的哪一點？", "question": "今天，我可以在哪一個小選擇上實踐「比較」？"}, {"theme": "失敗", "thought": "一次結 function petPoints(r){if(!r||typeof r!=="object")return 0;let mood=r.mood?5:0,n=(r.note||"").trim(),p=(r.practiceNote||"").trim();return mood+(n?Math.min(20,8+Math.floor(n.length/20)*3):0)+(p?Math.min(35,15+Math.floor(p.length/20)*4):0)+(r.reflection?5:0)}
function petTotal(){return Object.values(S.days||{}).reduce((a,r)=>a+petPoints(r),0)}
function petStage(x){let i=0;for(let j=0;j<PET_STAGES.length;j++)if(x>=PET_STAGES[j][1])i=j;return i}
function petState(){let c=petConfig();if(c.dailyState!=="auto"&&PET_STATES[c.dailyState])return c.dailyState;let r=S.days[taipeiToday()]||{},m=r.mood||"";if(m==="焦慮")return"worried";if(m==="疲憊")return"tired";if(m==="開心")return"happy";if(m==="生氣")return"thinking";if(m==="有力量")return"brave";if(m==="平靜")return"calm";if(r.practiceNote)return"reading";return["curious","resting","thinking","calm"][new Date(taipeiToday()+"T00:00:00").getDate()%4]}

const PET_GENERAL=["如果今天只做一件對自己好的事，你想選哪一件？","我想聽聽你的近況。今天有沒有一個瞬間，讓你更了解自己？","斯多噶提醒我們：能選擇的，是自己的判斷與行動。你今天想把心力放在哪裡？","有些事情無法控制，但你依然可以選擇用什麼態度面對。","把今天當成一次練習就好，不必把自己當成考卷。","今天最需要的是勇氣、耐心，還是一點休息呢？","每一次停下來觀察心情，都是在練習認識自己。","假如能對今天的自己說一句溫柔的話，你會說什麼？","我不會催你變好。你願意回來看看自己，就很重要。","不妨把『我應該』換成『我選擇』，感受一下有什麼不同。"];
function petLine(index){let c=petConfig(),state=petState(),pool=PET_DIALOGUES[state]||PET_DIALOGUES.calm,r=S.days[taipeiToday()]||{},count=Object.keys(S.days||{}).filter(k=>petPoints(S.days[k])>0).length;
let choices=pool.concat(PET_GENERAL),v=choices[((index%choices.length)+choices.length)%choices.length];
if(index>0&&index%6===0&&count>=3)v="我還記得你已經留下 "+count+" 天的內心練習。這些日子裡，有哪個改變讓你自己也驚訝？";
if(index>0&&index%7===0&&r.practiceNote)v="你今天願意記下練習的過程，這比做得完美更珍貴。回想一下，哪個片刻最值得記住？";
if(c.personality==="playful")v="啾啾！"+v;else if(c.personality==="wise")v="我想和你分享一個想法："+v;else if(c.personality==="brave")v="一起加油。"+v;
return v}

function petAppearance(x){const thresholds=[0,5,10,16,24,33,44,56,70,86,104,125,148,174,202,232,265,300,338,380,425,475,530,590,655,725,805,900,1030,1180];let i=0;for(let j=0;j<thresholds.length;j++)if(x>=thresholds[j])i=j;return i}
function updatePet(){let c=petConfig(),x=petTotal(),i=petStage(x),next=PET_STAGES[i+1],base=PET_STAGES[i][1],cap=next?next[1]:Math.max(x,base+1),pct=next?Math.min(100,100*(x-base)/(cap-base)):100;
document.getElementById("petArt").src=PET_IMAGE_DATA[petAppearance(x)];petDisplayName.textContent=c.name||"小哲";petText.textContent="今日狀態 · "+PET_STATES[petState()];document.getElementById("petChatButton").textContent="💬 與"+(c.name||"小哲")+"聊聊";fill.style.width=pct+"%";petXP.textContent="內心修行 · "+x+" XP";if(!petMessage.textContent.trim())showPetDialogue(petLine(0));petCustomName.value=c.name||"小哲";petGender.value=c.gender||"neutral";petPersonality.value=c.personality||"gentle";petDailyState.value=c.dailyState||"auto";if(!petBook.hidden)drawPetBook()}
function drawPetBook(){petBook.innerHTML="<b>修行筆記</b><p>每一次真誠地面對自己，都可能帶來一點改變。下一次蛻變何時發生，留給你和夥伴一起發現。</p><b>XP 規則</b><div>每日心情 +5；日記 +8～20；練習反思 +15～35；今日回應 +5。每個日期按內容計算一次，重複儲存不會刷分；修改紀錄會重新計算。</div><div>日常狀態會隨心情變化；服裝、場景、節日造型及 30+ 外觀保留擴充。</div>"}
function togglePetSettings(){let el=document.getElementById("petSettings"),b=document.getElementById("petSettingsToggle");el.hidden=!el.hidden;b.setAttribute("aria-expanded",String(!el.hidden));b.textContent=el.hidden?"⚙️ 夥伴設定":"⚙️ 收合設定"}
function completePetSettings(){savePetSetting();petConfig().settingsCompleted=true;localStorage.setItem(KEY,JSON.stringify(S));let el=document.getElementById("petSettings");el.hidden=true;let b=document.getElementById("petSettingsToggle");b.textContent="⚙️ 夥伴設定";b.setAttribute("aria-expanded","false")}
function togglePetBook(){petBook.hidden=!petBook.hidden;if(!petBook.hidden)drawPetBook()}
function petInteract(){let c=petConfig();c.talks=(c.talks||0)+1;localStorage.setItem(KEY,JSON.stringify(S));showPetDialogue(petLine(c.talks))}
function savePetSetting(){let c=petConfig();c.name=petCustomName.value.trim().slice(0,12)||"小哲";c.gender=petGender.value;c.personality=petPersonality.value;c.dailyState=petDailyState.value;localStorage.setItem(KEY,JSON.stringify(S));updatePet()}
addEventListener("DOMContentLoaded",()=>{if(!petConfig().settingsCompleted){document.getElementById("petSettings").hidden=false;document.getElementById("petSettingsToggle").textContent="⚙️ 收合設定";document.getElementById("petSettingsToggle").setAttribute("aria-expanded","true")}["petCustomName","petGender","petPersonality","petDailyState"].forEach(id=>document.getElementById(id).addEventListener("change",savePetSetting))});
function updateStats(){let k=Object.keys(S.days);days.textContent=k.length;writes.textContent=k.filter(x=>S.days[x].note||S.days[x].practiceNote).length;moodCount.textContent=k.filter(x=>S.days[x].mood).length;let d=new Date(taipeiToday()+"T00:00:00"),c=0;while(S.days[iso(d)]){c++;d.setDate(d.getDate()-1)}streak.textContent=`連續 ${c} 天`}
function toastMsg(x){toast.textContent=x;toast.style.display="block";setTimeout(()=>toast.style.display="none",1300)}
function exportData(){let b=new Blob([JSON.stringify({version:"3.0",exportedAt:new Date().toISOString(),data:S},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="日日斯多噶_我的人生軌跡.json";a.click();URL.revokeObjectURL(a.href);toastMsg("日記已匯出")}
importFile.addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.data||!x.data.days)throw 0;S.days={...S.days,...x.data.days};S.xp=Math.max(S.xp||0,x.data.xp||0);if(x.data.pet)S.pet=x.data.pet;localStorage.setItem(KEY,JSON.stringify(S));render();toastMsg("日記已匯入")}catch(_){toastMsg("檔案格式不正確")}};r.readAsText(f)});
let deferredPrompt;addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;install.classList.add("show");install.onclick=async()=>{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.classList.remove("show")}});
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));render();
</script></body></html>
